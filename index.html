    const q = regInput.trim().toLowerCase();
    if (q.length < 2) return [];
    return ROSTER.filter((s) => s.name.toLowerCase().includes(q) || s.reg.toLowerCase().includes(q)).slice(0, 8);
  }, [regInput]);

  async function proceedWithReg(reg, rosterEntry) {
    setRegErr('');
    const check = validateRegNumber(reg);
    if (!check.valid) { setRegErr(check.reason); return; }
    setCheckingReg(true);
    const claimed = await isRegNumberClaimed(check.reg);
    setCheckingReg(false);
    if (claimed) { setRegErr('This registration number has already been claimed. Log in instead, or use Forgot password.'); return; }
    const inRoster = rosterEntry || ROSTER.find((s) => s.reg === check.reg);
    setPicked({
      reg: check.reg,
      name: inRoster ? inRoster.name : '',
      year: inRoster ? inRoster.year : null,
      sem: inRoster ? inRoster.sem : null,
      entryYear: check.entryYear,
      isNewIntake: !inRoster,
    });
    if (inRoster) {
      const parts = inRoster.name.trim().split(' ');
      setGivenName(parts.slice(1).join(' ') || parts[0]);
      setSurname(parts[0]);
    }
    setStep(2);
  }

  function validateStep2() {
    if (!surname.trim() || !givenName.trim()) { setErr('Enter your surname and given name.'); return false; }
    if (!gender) { setErr('Select your gender.'); return false; }
    if (!dob) { setErr('Enter your date of birth.'); return false; }
    if (!district) { setErr('Select your district of origin.'); return false; }
    if (!nokName.trim() || !nokRelation || !nokPhone.trim()) { setErr('Fill in next of kin name, relationship and phone.'); return false; }
    if (!idPhoto) { setErr(picked.isNewIntake ? 'Upload your admission letter or registration receipt.' : 'Upload a photo of your student ID card.'); return false; }
    setErr('');
    return true;
  }

  async function addIdPhoto(fileList) {
    setErr('');
    const file = (fileList || [])[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { setErr('That file is too large (max ~4MB).'); return; }
    setIdPhotoBusy(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setIdPhoto({ name: file.name, dataUrl });
    } catch (e) {
      setErr('Could not read that file. Please try again.');
    }
    setIdPhotoBusy(false);
  }

  async function createAccount() {
    setErr('');
    if (!pw || pw.length < 6) { setErr('Password must be at least 6 characters.'); return; }
    if (pw !== pw2) { setErr('Passwords do not match.'); return; }
    if (!email) { setErr('Email is required.'); return; }
    setBusy(true);
    let client;
    try {
      client = getAuthClient();
    } catch (e) {
      setBusy(false);
      setErr(e.message);
      return;
    }
    const fullname = surname.trim().toUpperCase() + ' ' + givenName.trim().toUpperCase();
    const age = calcAge(dob);
    const { data: signUpData, error } = await client.auth.signUp({
      email,
      password: pw,
      options: {
        data: {
          fullname,
          reg: picked.reg,
          surname: surname.trim(),
          given_name: givenName.trim(),
          gender,
          dob,
          age,
          district,
          nationality: nationality.trim(),
          entry_year: picked.entryYear,
          academic_year: picked.year,
          academic_sem: picked.sem,
          next_of_kin_name: nokName.trim(),
          next_of_kin_relation: nokRelation,
          next_of_kin_phone: nokPhone.trim(),
          next_of_kin_phone2: nokPhone2.trim(),
          postal_address: address.trim(),
          phone: phone.trim(),
        },
      },
    });
    if (error) {
      setBusy(false);
      const msg = (error.message || '').toLowerCase();
      if (msg.includes('unique_reg') || (msg.includes('duplicate') && msg.includes('reg'))) {
        setErr('This registration number has already been claimed. Log in instead, or use Forgot password.');
      } else {
        setErr(error.message);
      }
      return;
    }

    // The students row itself is created server-side (Supabase trigger) from
    // the auth signup metadata above. This second step attaches the ID
    // card / admission letter photo, which is too large to pass as auth
    // metadata, directly onto that row once it exists.
    if (idPhoto && signUpData && signUpData.user) {
      try {
        await client.from('students').update({ id_card_url: idPhoto.dataUrl }).eq('reg', picked.reg);
      } catch (e) {
        console.warn('Could not attach ID photo to student record', e);
      }
    }

    setBusy(false);
    alert('Account created successfully. Please log in.');
    goLogin();
  }

  return (
    <div className="min-h-screen bg-transparent flex items-center justify-center p-4">
      <div className="w-full max-w-md bg-white/65 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-7">
        <div className="flex items-center gap-3 mb-5">
          <Logo size={44} />
          <div>
            <h1 className="font-bold text-slate-900 text-sm leading-tight">Create your student account</h1>
            <p className="text-xs text-slate-400">Fort Portal College of Health Sciences · Step {step} of 3</p>
          </div>
        </div>

        {(err || regErr) && (
          <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
            <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
            <span>{err || regErr}</span>
          </div>
        )}

        {step === 1 && (
          <>
            <Field label="Registration number">
              <div className="relative">
                <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input
                  autoFocus
                  className={inputCls + ' pl-9'}
                  placeholder="e.g. UAHEB/PHA/100/001/24"
                  value={regInput}
                  onChange={(e) => setRegInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && proceedWithReg(regInput)}
                />
              </div>
            </Field>
            <button
              onClick={() => proceedWithReg(regInput)}
              disabled={checkingReg}
              className="w-full bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60"
            >
              {checkingReg ? 'Checking…' : 'Continue'}
            </button>
            <p className="text-[11px] text-slate-400 mt-2">
              New intake without a printed reg number yet? Enter the number your Reg Number was issued and you'll be asked to upload your admission letter or registration receipt instead of an ID.
            </p>

            {rosterMatches.length > 0 && (
              <div className="mt-4">
                <p className="text-xs font-semibold text-slate-500 mb-1">Or pick your name from the roster</p>
                <div className="max-h-56 overflow-y-auto divide-y divide-white/50 border border-slate-200 rounded-lg">
                  {rosterMatches.map((s) => (
                    <button
                      key={s.reg}
                      onClick={() => proceedWithReg(s.reg, s)}
                      className="w-full text-left px-3 py-2.5 hover:bg-slate-50 flex items-center justify-between"
                    >
                      <span>
                        <span className="block text-sm font-medium text-slate-800">{s.name}</span>
                        <span className="block text-xs text-slate-400">{s.reg} · Year {s.year}, Sem {s.sem}</span>
                      </span>
                      <ChevronRight size={16} className="text-slate-300" />
                    </button>
                  ))}
                </div>
              </div>
            )}
            <button onClick={goLogin} className="w-full mt-4 text-center text-xs text-blue-800 font-semibold hover:underline">
              Already have an account? Log in
            </button>
          </>
        )}

        {step === 2 && picked && (
          <>
            <button onClick={() => setStep(1)} className="flex items-center gap-1 text-xs text-slate-400 mb-3 hover:text-slate-600">
              <ArrowLeft size={13} /> Change reg number
            </button>
            <div className="bg-slate-50 rounded-lg px-3 py-2.5 mb-4 text-sm">
              <p className="font-semibold text-slate-800">{picked.reg}</p>
              <p className="text-xs text-slate-400">
                {picked.isNewIntake ? 'New intake · Entry year ' + picked.entryYear : 'Year ' + picked.year + ', Sem ' + picked.sem}
              </p>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Surname"><input className={inputCls} value={surname} onChange={(e) => setSurname(e.target.value)} /></Field>
              <Field label="Given name"><input className={inputCls} value={givenName} onChange={(e) => setGivenName(e.target.value)} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Gender">
                <select className={inputCls} value={gender} onChange={(e) => setGender(e.target.value)}>
                  <option value="">Select…</option>
                  <option>Male</option><option>Female</option><option>Other</option>
                </select>
              </Field>
              <Field label={'Date of birth' + (dob ? ' (age ' + calcAge(dob) + ')' : '')}>
                <input type="date" className={inputCls} value={dob} onChange={(e) => setDob(e.target.value)} />
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Field label="District of origin">
                <select className={inputCls} value={district} onChange={(e) => setDistrict(e.target.value)}>
                  <option value="">Select…</option>
                  {DISTRICTS.map((d) => <option key={d}>{d}</option>)}
                </select>
              </Field>
              <Field label="Nationality"><input className={inputCls} value={nationality} onChange={(e) => setNationality(e.target.value)} /></Field>
            </div>
            <Field label="Home / postal address">
              <input className={inputCls} value={address} onChange={(e) => setAddress(e.target.value)} placeholder="P.O. Box, Village/Town" />
            </Field>

            <p className="text-xs font-semibold text-slate-600 mt-3 mb-1">Next of kin / guardian</p>
            <Field label="Full name"><input className={inputCls} value={nokName} onChange={(e) => setNokName(e.target.value)} /></Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label="Relationship">
                <select className={inputCls} value={nokRelation} onChange={(e) => setNokRelation(e.target.value)}>
                  <option value="">Select…</option>
                  {NOK_RELATIONS.map((r) => <option key={r}>{r}</option>)}
                </select>
              </Field>
              <Field label="Primary phone"><input className={inputCls} value={nokPhone} onChange={(e) => setNokPhone(e.target.value)} /></Field>
            </div>
            <Field label="Secondary / WhatsApp phone (optional)">
              <input className={inputCls} value={nokPhone2} onChange={(e) => setNokPhone2(e.target.value)} />
            </Field>

            <Field label={picked.isNewIntake ? 'Admission letter or registration receipt' : 'Student ID card photo'}>
              <input type="file" accept="image/*,application/pdf" className={inputCls} onChange={(e) => addIdPhoto(e.target.files)} />
              {idPhotoBusy && <p className="text-[11px] text-slate-400 mt-1">Reading file…</p>}
              {idPhoto && !idPhotoBusy && <p className="text-[11px] text-emerald-600 mt-1">Attached: {idPhoto.name}</p>}
            </Field>

            <button
              onClick={() => validateStep2() && setStep(3)}
              className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm"
            >
              Continue
            </button>
          </>
        )}

        {step === 3 && picked && (
          <>
            <button onClick={() => setStep(2)} className="flex items-center gap-1 text-xs text-slate-400 mb-3 hover:text-slate-600">
              <ArrowLeft size={13} /> Back
            </button>
            <div className="bg-slate-50 rounded-lg px-3 py-2.5 mb-4 text-sm">
              <p className="font-semibold text-slate-800">{surname.toUpperCase()} {givenName.toUpperCase()}</p>
              <p className="text-xs text-slate-400">{picked.reg}</p>
            </div>
            <PasswordField label="Create a password" value={pw} onChange={setPw} />
            <PasswordField label="Confirm password" value={pw2} onChange={setPw2} onEnter={createAccount} />
            <Field label="Email address (required — your login and OTP verification go here)">
              <input className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@email.com" required />
            </Field>
            <Field label="Phone (optional)">
              <input className={inputCls} value={phone} onChange={(e) => setPhone(e.target.value)} />
            </Field>
            <button
              onClick={createAccount}
              disabled={busy}
              className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm transition-colors disabled:opacity-60"
            >
              {busy ? 'Creating account…' : 'Create Account'}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

/* ===================== ADMISSIONS: new-applicant flow =====================
   Separate from SignupScreen above (which is for students already on the
   roster). Anyone can apply here without an existing account; the Registrar
   reviews the application (see ARApplicationsSection) and, on approval,
   the app generates a PRN for the one-off commitment fee. */
function ApplyScreen({ goLogin }) {
  const [step, setStep] = useState(1); // 1 bio-data, 2 academics, 3 documents, 4 done
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [ref, setRef] = useState('');

  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [age, setAge] = useState('');
  const [gender, setGender] = useState('');
  const [nationality, setNationality] = useState('Ugandan');
  const [location, setLocation] = useState('');
  const [formerSchool, setFormerSchool] = useState('');
  const [program, setProgram] = useState('');
  const [resultsSummary, setResultsSummary] = useState('');
  const [documents, setDocuments] = useState([]); // [{name, dataUrl}]
  const [filesBusy, setFilesBusy] = useState(false);

  async function addFiles(fileList) {
    setErr('');
    setFilesBusy(true);
    try {
      const added = [];
      for (const file of Array.from(fileList || [])) {
        if (file.size > 4 * 1024 * 1024) {
          setErr('"' + file.name + '" is too large (max ~4MB per file).');
          continue;
        }
        const dataUrl = await fileToDataUrl(file);
        added.push({ name: file.name, dataUrl });
      }
      setDocuments((prev) => [...prev, ...added]);
    } catch (e) {
      setErr('Could not read one of those files. Please try again.');
    }
    setFilesBusy(false);
  }
  function removeDoc(i) {
    setDocuments((prev) => prev.filter((_, idx) => idx !== i));
  }

  function validateStep1() {
    if (!name.trim() || !email.trim() || !phone.trim() || !age || !location.trim()) {
      setErr('Please fill in your name, email, phone, age and location.');
      return false;
    }
    return true;
  }
  function validateStep2() {
    if (!program || !formerSchool.trim() || !resultsSummary.trim()) {
      setErr('Please choose a program, your former school, and a short summary of your results.');
      return false;
    }
    return true;
  }

  async function submit() {
    setErr('');
    if (documents.length === 0) {
      setErr('Please attach at least one document (result slip or certificate).');
      return;
    }
    setBusy(true);
    const id = genRef('APP');
    const record = {
      id,
      name: name.trim(),
      email: email.trim().toLowerCase(),
      phone: phone.trim(),
      age: parseInt(age, 10) || null,
      gender,
      nationality: nationality.trim(),
      location: location.trim(),
      former_school: formerSchool.trim(),
      program,
      results_summary: resultsSummary.trim(),
      calculated_points: calcPointsFromSummary(resultsSummary),
      auto_status: null,
      failed_criteria: [],
      is_manual_override: false,
      override_reason: '',
      documents,
      status: 'pending',
      prn: null,
      review_note: '',
      reviewed_by: '',
      submitted_at: Date.now(),
      reviewed_at: null,
    };
    const ok = await dbInsertApplication(record);
    setBusy(false);
    if (!ok) {
      setErr('Could not submit your application right now. Please try again.');
      return;
    }
    setRef(id);
    setStep(4);
  }

  if (step === 4) {
    return (
      <div className="min-h-screen bg-transparent flex items-center justify-center p-4">
        <div className="w-full max-w-sm bg-white/65 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-7 text-center">
          <div className="w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center mx-auto mb-3">
            <CheckCircle2 size={26}/>
          </div>
          <h1 className="font-bold text-slate-900 text-lg">Application submitted</h1>
          <p className="text-xs text-slate-500 mt-2">
            Keep this reference number safe — you'll need it (with your email) to check your status and, once approved, to pay your commitment fee.
          </p>
          <p className="font-mono text-lg font-bold text-blue-900 bg-blue-50 border border-blue-200 rounded-lg py-3 mt-4 tracking-wider">{ref}</p>
          <button onClick={goLogin} className="w-full mt-5 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 text-white font-semibold rounded-lg py-2.5 text-sm">
            Back to Login
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-transparent flex items-center justify-center p-4">
      <div className="w-full max-w-md bg-white/65 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-7">
        <div className="flex items-center gap-3 mb-5">
          <Logo size={44} />
          <div>
            <h1 className="font-bold text-slate-900 text-sm leading-tight">Apply for Admission</h1>
            <p className="text-xs text-slate-400">Fort Portal College of Health Sciences · Step {step} of 3</p>
          </div>
        </div>

        {err && (
          <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
            <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
            <span>{err}</span>
          </div>
        )}

        {step === 1 && (
          <>
            <Field label="Full name"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
            <Field label="Email"><input className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
            <Field label="Phone"><input className={inputCls} value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Age"><input type="number" className={inputCls} value={age} onChange={(e) => setAge(e.target.value)} /></Field>
              <Field label="Gender">
                <select className={inputCls} value={gender} onChange={(e) => setGender(e.target.value)}>
                  <option value="">Select</option>
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                  <option value="Prefer not to say">Prefer not to say</option>
                </select>
              </Field>
            </div>
            <Field label="Nationality"><input className={inputCls} value={nationality} onChange={(e) => setNationality(e.target.value)} /></Field>
            <Field label="Home location / district"><input className={inputCls} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Kabarole District" /></Field>
            <button onClick={() => { if (validateStep1()) { setErr(''); setStep(2); } }}
              className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 text-white font-semibold rounded-lg py-2.5 text-sm">
              Continue
            </button>
            <button onClick={goLogin} className="w-full mt-3 text-center text-xs text-blue-800 font-semibold hover:underline">
              Already applied? Check your application status
            </button>
          </>
        )}

        {step === 2 && (
          <>
            <button onClick={() => setStep(1)} className="flex items-center gap-1 text-xs text-slate-400 mb-3 hover:text-slate-600"><ArrowLeft size={13}/> Back</button>
            <Field label="Program you're applying for">
              <select className={inputCls} value={program} onChange={(e) => setProgram(e.target.value)}>
                <option value="">Select a program</option>
                {PROGRAMS.map((p) => <option key={p.id} value={p.id}>{p.label} — {p.name}</option>)}
              </select>
            </Field>
            <Field label="Former school"><input className={inputCls} value={formerSchool} onChange={(e) => setFormerSchool(e.target.value)} /></Field>
            <Field label="Summary of your results">
              <textarea className={inputCls + ' min-h-[80px]'} value={resultsSummary} onChange={(e) => setResultsSummary(e.target.value)}
                placeholder="e.g. UCE: 6 credits including Biology and Chemistry; UACE: BCM — 2 principal passes" />
            </Field>
            <button onClick={() => { if (validateStep2()) { setErr(''); setStep(3); } }}
              className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 text-white font-semibold rounded-lg py-2.5 text-sm">
              Continue
            </button>
          </>
        )}

        {step === 3 && (
          <>
            <button onClick={() => setStep(2)} className="flex items-center gap-1 text-xs text-slate-400 mb-3 hover:text-slate-600"><ArrowLeft size={13}/> Back</button>
            <p className="text-xs font-semibold text-slate-600 mb-2">Attach your result slips / certificates (PDF or image)</p>
            <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl py-6 cursor-pointer hover:border-blue-700/60 hover:bg-blue-50/30 transition-colors mb-3">
              <Upload size={20} className="text-slate-400 mb-1" />
              <span className="text-xs text-slate-500">{filesBusy ? 'Reading files…' : 'Tap to choose files'}</span>
              <input type="file" multiple accept=".pdf,image/*" className="hidden" onChange={(e) => addFiles(e.target.files)} />
            </label>
            {documents.length > 0 && (
              <div className="space-y-1.5 mb-3">
                {documents.map((d, i) => (
                  <div key={i} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 text-xs">
                    <span className="truncate">{d.name}</span>
                    <button onClick={() => removeDoc(i)} className="text-rose-600 font-semibold flex-shrink-0 ml-2">Remove</button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={submit} disabled={busy || filesBusy}
              className="w-full mt-2 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60">
              {busy ? 'Submitting…' : 'Submit Application'}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function CheckApplicationScreen({ goLogin }) {
  const [ref, setRef] = useState('');
  const [email, setEmail] = useState('');
  const [app, setApp] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [prnInput, setPrnInput] = useState('');
  const [confirmMsg, setConfirmMsg] = useState('');

  async function lookup() {
    setErr('');
    setApp(null);
    setConfirmMsg('');
    if (!ref.trim() || !email.trim()) { setErr('Enter your application reference and the email you applied with.'); return; }
    setBusy(true);
    const rec = await dbLookupApplicationSelf(ref.trim().toUpperCase(), email.trim());
    setBusy(false);
    if (!rec) {
      setErr('No application found matching that reference and email.');
      return;
    }
    setApp(rec);
  }

  async function selfConfirmPayment() {
    setConfirmMsg('');
    if (!app || !app.prn) return;
    if (prnInput.trim() !== app.prn.prn) {
      setConfirmMsg('That PRN does not match — double-check the number.');

function PaymentsSection({ account, finance, setFinance, pushMail }) {
  const [amount, setAmount] = useState('');
  const [modal, setModal] = useState(null);
  const [confirmPrn, setConfirmPrn] = useState('');
  const [confirmMsg, setConfirmMsg] = useState('');

  async function generatePRN() {
    const amt = parseInt(amount, 10);
    if (!amt || amt <= 0) return;
    const prn = genPRN();
    const rec = {
      prn,
      amount: amt,
      status: 'pending',
      createdAt: Date.now(),
      expiry: Date.now() + 14 * 24 * 3600 * 1000,
    };
    const next = { ...finance, prns: [rec, ...finance.prns] };
    setFinance(next);
    await storeSet('finance:' + account.reg, next, true);
    setModal(rec);
    setAmount('');
  }

  async function confirmPayment() {
    setConfirmMsg('');
    const rec = finance.prns.find((p) => p.prn === confirmPrn.trim());
    if (!rec) {
      setConfirmMsg('No PRN found matching that reference number.');
      return;
    }
    if (rec.status === 'confirmed') {
      setConfirmMsg('This PRN has already been confirmed.');
      return;
    }
    if (Date.now() > rec.expiry) {
      setConfirmMsg('This PRN has expired. Please generate a new one.');
      return;
    }
    const prns = finance.prns.map((p) => (p.prn === rec.prn ? { ...p, status: 'confirmed', confirmedAt: Date.now() } : p));
    const next = { ...finance, paid: finance.paid + rec.amount, prns };
    setFinance(next);
    await storeSet('finance:' + account.reg, next, true);
    pushMail({
      id: genRef('MSG'),
      from: 'Bursar',
      subject: 'Payment Received',
      body: 'We have received your payment of ' + fmt(rec.amount) + ' (PRN ' + rec.prn + '). Thank you.',
      date: Date.now(),
      read: false,
    });
    setConfirmMsg('Payment confirmed — ' + fmt(rec.amount) + ' added to your account.');
    setConfirmPrn('');
  }

  function statusOf(p) {
    if (p.status === 'confirmed') return 'confirmed';
    if (Date.now() > p.expiry) return 'expired';
    return 'pending';
  }

  function downloadFeeStructure() {
    const rows = [
      ['Year', 'Tuition (per year, UGX)'],
      ...Object.entries(FEE_TIERS).map(([y, f]) => ['Year ' + y, f]),
    ];
    const csv = rows.map((r) => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'DPH_Fee_Structure.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div className="space-y-6">
      <div className="glass-tile rounded-[28px] p-5">
        <h3 className="font-bold text-slate-900 mb-1 text-base">Generate PRN to Deposit</h3>
        <p className="text-sm text-slate-600 mb-4">Enter an amount, then take the reference number to your bank.</p>
        <input
          type="number"
          className={inputCls + ' mb-3'}
          placeholder="Amount to deposit"
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
        />
        <button
          onClick={generatePRN}
          className="glass-btn-dark w-full transition-all text-white font-semibold rounded-xl px-5 py-3 text-sm"
        >
          Generate PRN
        </button>
      </div>

      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h3 className="font-bold text-slate-800 mb-1 text-sm">Confirm Payment</h3>
        <p className="text-xs text-slate-400 mb-4">
          No live bank link is connected here — simulate your bank teller confirming a PRN you generated.
        </p>
        <div className="flex flex-col sm:flex-row gap-3">
          <input
            className={inputCls + ' sm:max-w-xs'}
            placeholder="Enter PRN"
            value={confirmPrn}
            onChange={(e) => setConfirmPrn(e.target.value)}
          />
          <button
            onClick={confirmPayment}
            className="bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-semibold rounded-xl px-5 py-2.5 text-sm whitespace-nowrap shadow-md shadow-emerald-900/25 active:scale-[0.97] transition-all"
          >
            Confirm Payment
          </button>
        </div>
        {confirmMsg && <p className="text-xs mt-3 text-slate-600">{confirmMsg}</p>}
      </div>

      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-slate-800 text-sm">Transaction History</h3>
          <button onClick={downloadFeeStructure} className="flex items-center gap-1.5 text-xs font-semibold text-blue-800 hover:underline">
            <Download size={13} /> Fee Structure
          </button>
        </div>
        {finance.prns.length === 0 && <p className="text-xs text-slate-400">No transactions yet.</p>}
        <div className="divide-y divide-white/50">
          {finance.prns.map((p) => (
            <div key={p.prn} className="py-2.5 flex items-center justify-between text-sm">
              <div>
                <p className="font-medium text-slate-700">{fmt(p.amount)}</p>
                <p className="text-[11px] text-slate-400">
                  PRN {p.prn} · {fmtDate(p.createdAt)}
                </p>
              </div>
              <StatusPill status={statusOf(p)} />
            </div>
          ))}
        </div>
      </div>

      {modal && (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white/75 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 max-w-sm w-full p-6">
            <div className="flex items-center gap-2 text-emerald-600 mb-3">
              <CheckCircle2 size={20} />
              <h3 className="font-bold text-slate-800 text-sm">Payment Reference Generated Successfully</h3>
            </div>
            <div className="text-sm space-y-1.5 mb-4">
              <p>
                <span className="text-slate-400">Payment Reference No.: </span>
                <span className="font-semibold text-slate-800">{modal.prn}</span>
              </p>
              <p>
                <span className="text-slate-400">Total Amount to Pay: </span>
                <span className="font-semibold text-slate-800">{fmt(modal.amount)}</span>
              </p>
              <p>
                <span className="text-slate-400">Date of Expiry: </span>
                <span className="font-semibold text-rose-600">{fmtDate(modal.expiry)}</span>
              </p>
            </div>
            <div className="bg-blue-50 text-blue-900 text-xs rounded-lg px-3 py-2.5 mb-4">
              Copy this Payment Reference Number and go to your nearest bank to make your payment, or use Confirm Payment
              below once paid.
            </div>
            <button
              onClick={() => setModal(null)}
              className="w-full bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm"
            >
              OK
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function VotingSection({ account }) {
  const [election, setElection] = useState(null);
  const [votes, setVotes] = useState(null);
  const [voted, setVoted] = useState(null);

  useEffect(() => {
    loadElectionConfig().then(setElection);
    storeGet('election_votes', true).then((v) => setVotes(v || {}));
    storeGet('voted:' + account.reg, true).then((v) => setVoted(v || {}));
  }, [account.reg]);

  async function castVote(posId, candidate) {
    if (voted && voted[posId]) return;
    const nextVotes = { ...(votes || {}) };
    nextVotes[posId] = nextVotes[posId] || {};
    nextVotes[posId][candidate] = (nextVotes[posId][candidate] || 0) + 1;
    setVotes(nextVotes);
    await storeSet('election_votes', nextVotes, true);
    const nextVoted = { ...(voted || {}), [posId]: candidate };
    setVoted(nextVoted);
    await storeSet('voted:' + account.reg, nextVoted, true);
  }

  if (!election || !votes || !voted) return <p className="text-sm text-slate-400">Loading…</p>;

  return (
    <div className="space-y-6">
      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h3 className="font-bold text-slate-800 text-sm mb-1">{election.title}</h3>
        <p className="text-xs text-slate-400">Your vote is recorded once per position and cannot be changed.</p>
      </div>
      {election.positions.map((pos) => {
        const posVotes = votes[pos.id] || {};
        const total = Object.values(posVotes).reduce((a, b) => a + b, 0);
        const hasVoted = !!voted[pos.id];
        return (
          <div key={pos.id} className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
            <h4 className="font-semibold text-slate-800 text-sm mb-3">{pos.title}</h4>
            <div className="space-y-2">
              {pos.candidates.map((c) => {
                const count = posVotes[c] || 0;
                const pct = total ? Math.round((count / total) * 100) : 0;
                return (
                  <div key={c}>
                    <div className="flex items-center justify-between text-sm mb-1">
                      <span className="text-slate-700">

/* ===================== Academic Calendar (semester highlights) ===========
   A single shared list of date-range "highlights" (e.g. "Semester 1",
   "Mid-semester break") that only the Registrar can add or remove. Every
   account — students, the Registrar, and the Administrator — reads the
   same shared key, so a highlight the Registrar sets shows up everywhere
   automatically. The calendar view itself always opens on today's real
   month/year, whatever year that turns out to be. */
const CALENDAR_COLORS = [
  { name: 'Emerald', value: '#10b981' },
  { name: 'Blue', value: '#2563eb' },
  { name: 'Amber', value: '#d97706' },
  { name: 'Rose', value: '#e11d48' },
  { name: 'Purple', value: '#7c3aed' },
];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); } // m is 0-indexed
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstWeekday(y, m) { return new Date(y, m, 1).getDay(); }
function highlightForDate(highlights, dateStr) {
  return (highlights || []).find((h) => dateStr >= h.startDate && dateStr <= h.endDate) || null;
}

function SemesterCalendar({ highlights, editable, onAdd, onDelete }) {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [rangeStart, setRangeStart] = useState(null);
  const [rangeEnd, setRangeEnd] = useState(null);
  const [label, setLabel] = useState('');
  const [color, setColor] = useState(CALENDAR_COLORS[0].value);
  const [showForm, setShowForm] = useState(false);

  function jumpToday() {
    setViewYear(today.getFullYear());
    setViewMonth(today.getMonth());
  }
  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear((y) => y - 1); } else setViewMonth((m) => m - 1);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear((y) => y + 1); } else setViewMonth((m) => m + 1);
  }
  function cancelSelection() {
    setRangeStart(null); setRangeEnd(null); setShowForm(false); setLabel('');
  }
  function clickDay(dateStr) {
    if (!editable) return;
    if (!rangeStart || (rangeStart && rangeEnd)) {
      setRangeStart(dateStr);
      setRangeEnd(null);
      setShowForm(false);
    } else if (dateStr < rangeStart) {
      setRangeEnd(rangeStart);
      setRangeStart(dateStr);
      setShowForm(true);
    } else {
      setRangeEnd(dateStr);
      setShowForm(true);
    }
  }
  function confirmAdd() {
    if (!label.trim() || !rangeStart || !rangeEnd) return;
    onAdd({ id: genRef('SEM'), label: label.trim(), startDate: rangeStart, endDate: rangeEnd, color });
    cancelSelection();
  }

  const dim = daysInMonth(viewYear, viewMonth);
  const startWeekday = firstWeekday(viewYear, viewMonth);
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);
  const todayStr = ymd(today.getFullYear(), today.getMonth(), today.getDate());

  return (
    <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5 max-w-lg">
      <div className="flex items-center justify-between mb-3">
        <button onClick={prevMonth} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><ArrowLeft size={16}/></button>
        <div className="text-center">
          <p className="font-bold text-slate-800 text-sm">{MONTH_NAMES[viewMonth]} {viewYear}</p>
          <button onClick={jumpToday} className="text-[11px] text-blue-800 font-semibold hover:underline">Today</button>
        </div>
        <button onClick={nextMonth} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><ChevronRight size={16}/></button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold text-slate-400 mb-1">
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => <div key={i}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const dateStr = ymd(viewYear, viewMonth, d);
          const h = highlightForDate(highlights, dateStr);
          const inPendingRange = editable && rangeStart && dateStr >= rangeStart && dateStr <= (rangeEnd || rangeStart);
          return (
            <button key={i} onClick={() => clickDay(dateStr)} disabled={!editable}
              className={'aspect-square rounded-lg text-xs flex items-center justify-center ' +
                (dateStr === todayStr ? 'ring-2 ring-blue-600 ' : '') +
                (editable ? 'cursor-pointer hover:opacity-80 ' : 'cursor-default ')}
              style={{
                backgroundColor: inPendingRange ? '#93c5fd' : (h ? h.color + '33' : 'transparent'),
                color: h && !inPendingRange ? h.color : '#334155',
                fontWeight: h ? 700 : 500,
              }}>
              {d}
            </button>
          );
        })}
      </div>

      {editable && rangeStart && !rangeEnd && (
        <p className="text-xs text-blue-700 mt-3">Start picked: {rangeStart} — now tap the end day.</p>
      )}
      {editable && showForm && (
        <div className="mt-4 border-t border-slate-200/70 pt-3 space-y-2">
          <p className="text-xs text-slate-500">{rangeStart} → {rangeEnd}</p>
          <input className={inputCls + ' text-xs'} placeholder="e.g. Semester 1 Examinations" value={label} onChange={(e) => setLabel(e.target.value)} />
          <div className="flex gap-1.5">
            {CALENDAR_COLORS.map((c) => (
              <button key={c.value} onClick={() => setColor(c.value)}
                className={'w-6 h-6 rounded-full border-2 ' + (color === c.value ? 'border-slate-700' : 'border-transparent')}
                style={{ backgroundColor: c.value }} title={c.name} />
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={confirmAdd} className="flex-1 bg-blue-950 hover:bg-blue-900 text-white text-xs font-semibold rounded-lg py-2">Add to calendar</button>
            <button onClick={cancelSelection} className="flex-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-lg py-2">Cancel</button>
          </div>
        </div>
      )}

      {(highlights || []).length > 0 && (
        <div className="mt-4 border-t border-slate-200/70 pt-3 space-y-1.5">
          {highlights.map((h) => (
            <div key={h.id} className="flex items-center justify-between text-xs gap-2">
              <span className="flex items-center gap-2 min-w-0">
                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: h.color }} />
                <span className="text-slate-700 font-medium truncate">{h.label}</span>
                <span className="text-slate-400 flex-shrink-0">{h.startDate} → {h.endDate}</span>
              </span>
              {editable && <button onClick={() => onDelete(h.id)} className="text-slate-400 hover:text-rose-600 flex-shrink-0"><X size={13}/></button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ARCalendarSection() {
  const [highlights, setHighlights] = useState(null);

  async function load() {
    setHighlights((await storeGet('academic_calendar', true)) || []);
  }
  useEffect(() => { load(); }, []);

  async function addHighlight(h) {
    const fresh = (await storeGet('academic_calendar', true)) || [];
    const next = [...fresh, h];
    await storeSet('academic_calendar', next, true);
    setHighlights(next);
  }
  async function deleteHighlight(id) {
    const fresh = (await storeGet('academic_calendar', true)) || [];
    const next = fresh.filter((h) => h.id !== id);
    await storeSet('academic_calendar', next, true);
    setHighlights(next);

  if (!highlights) return <p className="text-sm text-slate-400 p-4 text-center">Loading…</p>;

  return (
    <div className="space-y-4 max-w-lg">

function SurveysSection({ account }) {
  const [, forceTick] = useState(0);
  useEffect(() => { ensureMarksLoaded(account.reg).then((changed) => changed && forceTick((t) => t + 1)); }, [account.reg]);
  const records = resultsByReg[account.reg] || [];
  const latest = records.reduce((a, b) => (!a || b.year * 10 + b.sem > a.year * 10 + a.sem ? b : a), null);
  const courses = latest ? Object.keys(latest.marks) : [];
  const [surveys, setSurveys] = useState(null);
  const [draft, setDraft] = useState({});

  useEffect(() => {
    storeGet('surveys:' + account.reg, true).then((s) => setSurveys(s || {}));
  }, [account.reg]);

  async function submit(code) {
    const rating = draft[code]?.rating || 0;
    if (!rating) return;
    const next = { ...surveys, [code]: { rating, comment: draft[code]?.comment || '', date: Date.now() } };
    setSurveys(next);
    await storeSet('surveys:' + account.reg, next, true);
  }

  if (!surveys) return <p className="text-sm text-slate-400">Loading…</p>;

  return (
    <div className="space-y-4">
      {courses.length === 0 && <p className="text-sm text-slate-400">No courses to evaluate yet.</p>}
      {courses.map((code) => {
        const done = surveys[code];
        return (
          <div key={code} className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
            <h4 className="font-semibold text-slate-800 text-sm mb-1">{CODES[code] || code}</h4>
            <p className="text-xs text-slate-400 mb-3">{code}</p>
            {done ? (
              <div className="flex items-center gap-2 text-emerald-600 text-xs font-semibold">
                <CheckCircle2 size={14} /> Submitted — {done.rating}/5 stars
              </div>
            ) : (
              <>
                <div className="flex gap-1 mb-3">
                  {[1, 2, 3, 4, 5].map((n) => (
                    <button
                      key={n}
                      onClick={() => setDraft({ ...draft, [code]: { ...draft[code], rating: n } })}
                    >
                      <Star
                        size={20}
                        className={(draft[code]?.rating || 0) >= n ? 'fill-amber-400 text-amber-400' : 'text-slate-300'}
                      />
                    </button>
                  ))}
                </div>
                <textarea
                  className={inputCls + ' mb-3'}
                  rows={2}
                  placeholder="Optional comment"
                  value={draft[code]?.comment || ''}
                  onChange={(e) => setDraft({ ...draft, [code]: { ...draft[code], comment: e.target.value } })}
                />
                <button
                  onClick={() => submit(code)}
                  className="bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg px-4 py-2 text-xs"
                >
                  Submit Evaluation
                </button>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ========================= STUDENT APP ERROR BOUNDARY =========================
   Prevents a render-time error in one dashboard section from leaving #root
   completely blank on mobile browsers. */
class StudentAppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, info) {
    console.error('ACMIS student dashboard render error:', error, info);
  }

  render() {
    if (!this.state.hasError) return this.props.children;

    const message = this.state.error?.message || 'An unexpected error occurred.';
    return (
      <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-5">
        <div className="w-full max-w-md rounded-2xl bg-white/10 border border-white/15 backdrop-blur-xl p-6">
          <h2 className="text-lg font-bold mb-2">Student Portal Error</h2>
          <p className="text-sm text-slate-300 mb-4">
            Your account was authenticated, but the student dashboard could not be displayed.
          </p>
          <div className="text-xs text-rose-200 bg-rose-500/10 border border-rose-400/20 rounded-xl p-3 break-words">
            {message}
          </div>
          <button
            onClick={() => window.location.reload()}
            className="w-full mt-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5"
          >
            Reload Portal
          </button>
        </div>
      </div>
    );
  }
}

function RoleAvatarButton({ role, index, onPick }) {
  // pressed: finger/mouse currently down -> avatar zooms OUT (shrinks + recedes)
  // released: finger/mouse lifts -> avatar zooms back IN with an elastic overshoot
  const [pressed, setPressed] = useState(false);
  const [rippleKey, setRippleKey] = useState(0);
  const [settling, setSettling] = useState(false);
  const settleTimer = useRef(null);
  const Icon = role.icon;

  const down = () => {
    setSettling(false);
    setPressed(true);
  };
  const up = (fire) => {
    setPressed(false);
    if (fire) {
      setRippleKey((k) => k + 1);
      setSettling(true);
      clearTimeout(settleTimer.current);
      settleTimer.current = setTimeout(() => setSettling(false), 560);
    }
  };

  return (
    <button
      onClick={() => onPick(role.id)}
      onPointerDown={down}
      onPointerUp={() => up(true)}
      onPointerLeave={() => up(false)}
      onPointerCancel={() => up(false)}
      className="flex flex-col items-center gap-2 select-none"
      style={{
        opacity: 0,
        animation: 'gateAvatarIn .7s cubic-bezier(.22,1,.36,1) both',
        animationDelay: 0.45 + index * 0.12 + 's',
        WebkitTapHighlightColor: 'transparent',
      }}
    >
      <div
        className="relative w-20 h-20 rounded-full bg-gradient-to-br from-blue-900 to-blue-950 text-white flex items-center justify-center ring-2 ring-white/40"
        style={{
          transform: pressed ? 'scale(0.68) translateY(3px)' : 'scale(1)',
          boxShadow: pressed
            ? '0 1px 6px rgba(0,0,0,0.45), inset 0 2px 8px rgba(0,0,0,0.35)'
            : '0 12px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25)',
          filter: pressed ? 'brightness(0.85)' : 'brightness(1)',
          transition: pressed
            ? 'transform 160ms cubic-bezier(.4,0,.2,1), box-shadow 160ms ease-out, filter 160ms ease-out'
            : 'transform 200ms ease-out, box-shadow 300ms ease-out, filter 200ms ease-out',
          animation: settling ? 'avatarSettle .56s cubic-bezier(.22,1.4,.36,1) both' : 'none',
        }}
      >
        {/* ripple ring fired on release */}
        <span
          key={rippleKey}
          className="pointer-events-none absolute inset-0 rounded-full border-2 border-white/70"
          style={rippleKey ? { animation: 'avatarRippleOut .55s ease-out forwards' } : { opacity: 0 }}
        />
        <Icon size={34} style={{ transition: 'transform 160ms ease-out', transform: pressed ? 'scale(0.9)' : 'scale(1)' }} />
      </div>
      <span
        className="font-bold text-slate-900 text-base drop-shadow-sm"
        style={{
          transform: pressed ? 'scale(0.86)' : 'scale(1)',
          opacity: pressed ? 0.7 : 1,
          transition: pressed ? 'transform 160ms ease-out, opacity 160ms ease-out' : 'transform 520ms cubic-bezier(.34,1.56,.64,1), opacity 300ms ease-out',
        }}
      >
        {role.label}
      </span>
    </button>
  );
}

/* Defined at module scope (not inside ARLoginScreen) on purpose: a component
   declared inside another component's function body gets recreated every
   render, which makes React remount its whole subtree — including any

/* ===================== STAFF LOGIN (Registrar + Admin) ======================
   Both roles now use real Supabase Auth for password login. First-time setup
   and password reset go through Supabase's own email-OTP handshake
   (signInWithOtp / verifyOtp — sent and verified server-side by Supabase,
   not a custom code we invented) to prove the person controls the
   whitelisted email before claim_staff_role() will grant them the role.
   Authorization is enforced server-side (RLS is_staff() checks) — this
   component only drives the UX. */
function StaffLoginScreen({ role, roleLabel, allowedEmail, icon, kvPrefix, kvId, onLogin, goRoleGate }) {
  const [step, setStep] = useState('password'); // password | code | setPassword
  const [pw, setPw] = useState('');
  const [code, setCode] = useState('');
  const [newPw, setNewPw] = useState('');
  const [newPw2, setNewPw2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function finishLogin() {
    // Non-auth metadata (course units, pay, etc.) that dashboards further
    // down still key off of — access to it is staff-only now (RLS), which
    // is fine since we only get here once claim_staff_role/sign-in succeeded.
    const meta = (await storeGet(kvPrefix + kvId, true)) || { id: kvId, name: roleLabel };
    onLogin({ ...meta, id: kvId, email: allowedEmail });
  }

  async function submitPassword() {
    setErr('');
    if (!pw) { setErr('Enter your password.'); return; }
    setBusy(true);
    const client = getAuthClient();
    const { error } = await client.auth.signInWithPassword({ email: allowedEmail, password: pw });
    if (error) {
      setBusy(false);
      setErr('Incorrect password.');
      return;
    }
    const { data: roleData, error: roleErr } = await client.rpc('my_staff_role');
    setBusy(false);
    if (roleErr || roleData !== role) {
      await client.auth.signOut();
      setErr('This account is not authorized for this role.');
      return;
    }
    await finishLogin();
  }

  async function requestCode() {
    setErr('');
    setBusy(true);
    try {
      await callOtpFunction('request', { email: allowedEmail, purpose: 'staff-' + role });
      setStep('code');
    } catch (e) {
      setErr(e.message);
    }
    setBusy(false);
  }

  async function submitCode() {
    setErr('');
    if (!code.trim()) { setErr('Enter the code from your email.'); return; }
    // The code itself is checked together with the new password in
    // completeSetup(), in one atomic call to the email-otp function —
    // this step just collects it before moving on.
    setStep('setPassword');
  }

  async function completeSetup() {
    setErr('');
    if (!newPw || newPw.length < 6) { setErr('Choose a password with at least 6 characters.'); return; }
    if (newPw !== newPw2) { setErr('Passwords do not match.'); return; }
    setBusy(true);
    try {
      await callOtpFunction('verify', {
        email: allowedEmail,
        purpose: 'staff-' + role,
        code: code.trim(),
        newPassword: newPw,
      });
    } catch (e) {
      setBusy(false);
      setErr(e.message);
      return;
    }
    const client = getAuthClient();
    const { error: signInErr } = await client.auth.signInWithPassword({ email: allowedEmail, password: newPw });
    if (signInErr) {
      setBusy(false);
      setErr('Password was set, but automatic sign-in failed: ' + signInErr.message + '. Try signing in again.');
      return;
    }
    const { data: claimed, error: claimErr } = await client.rpc('claim_staff_role', { p_role: role });
    setBusy(false);
    if (claimErr || !claimed) {
      await client.auth.signOut();
      setErr('Could not verify this email is authorized for this role.');
      return;
    }
    await finishLogin();
  }

  const ErrBanner = err ? (
    <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
      <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
      <span>{err}</span>
    </div>
  ) : null;

  if (step === 'code') {
    return (
      <ARLoginShell icon={<Key size={24}/>} title="Enter confirmation code"
        subtitle={'A one-time code was sent to ' + allowedEmail + '.'}
        goRoleGate={goRoleGate}>
        {ErrBanner}
        <div className="mb-3 flex items-start gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] rounded-lg px-3 py-2">
          <span>Check your inbox (and spam folder).</span>
        </div>
        <Field label="Confirmation code">
          <input className={inputCls + ' tracking-widest font-mono text-center'} value={code} onChange={(e) => setCode(e.target.value)} placeholder="e.g. 384022" onKeyDown={(e) => e.key === 'Enter' && submitCode()} />
        </Field>
        <button onClick={submitCode} disabled={busy} className="w-full mt-2 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold rounded-xl py-2.5 text-sm disabled:opacity-60">
          Confirm
        </button>
        <button onClick={requestCode} disabled={busy} className="w-full mt-2 text-center text-xs text-slate-400 hover:text-slate-600 hover:underline disabled:opacity-60">
          Resend code
        </button>
      </ARLoginShell>
    );
  }

  if (step === 'setPassword') {
    return (
      <ARLoginShell icon={<Key size={24}/>} title="Choose your password"
        subtitle="This finishes verification and sets your sign-in password."
        goRoleGate={goRoleGate}>
        {ErrBanner}
        <PasswordField label="Create a password" value={newPw} onChange={setNewPw} />
        <PasswordField label="Confirm password" value={newPw2} onChange={setNewPw2} onEnter={completeSetup} />
        <button onClick={completeSetup} disabled={busy} className="w-full mt-2 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold rounded-xl py-2.5 text-sm disabled:opacity-60">
          {busy ? 'Saving…' : 'Set Password & Continue'}
        </button>
      </ARLoginShell>
    );
  }

  // step === 'password'
  return (
    <ARLoginShell icon={icon} title={roleLabel + ' Login'} subtitle="Fort Portal College of Health Sciences" goRoleGate={goRoleGate}>
      {ErrBanner}
      <p className="text-xs text-slate-400 mb-3 text-center">{allowedEmail}</p>
      <PasswordField label="Password" value={pw} onChange={setPw} onEnter={submitPassword} />
      <div className="flex justify-end -mt-2 mb-3">
        <button onClick={requestCode} disabled={busy} className="text-xs text-blue-800 font-semibold hover:underline">Forgot password? / First-time setup</button>
      </div>
      <button onClick={submitPassword} disabled={busy} className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60">
        {busy ? 'Signing in…' : 'Sign In'}
      </button>
    </ARLoginShell>
  );
}

/* ===================== PDF helpers for marks import ===================== */
async function extractPdfPageLines(page) {
  const textContent = await page.getTextContent();
  const rows = {};
  textContent.items.forEach((it) => {
    const y = Math.round(it.transform[5] / 3) * 3; // bucket nearby baselines together
    if (!rows[y]) rows[y] = [];
    rows[y].push(it);
  });
  return Object.keys(rows)
    .map(Number)
    .sort((a, b) => b - a)
    .map((y) => rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map((it) => it.str).join(' '))
    .map((s) => s.replace(/\s+/g, ' ').trim())
    .filter(Boolean);
}
async function renderPdfPageToDataUrl(page, scale) {
  const viewport = page.getViewport({ scale: scale || 1.3 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL('image/png');
}
const REG_RE = /[A-Z]{2,10}\/\d{1,4}\/\d{1,4}\/\d{1,4}/i;
function parseMarksLine(line) {
  const regMatch = line.match(REG_RE);
  const numTokens = (line.match(/\d{1,2}(?:\.\d{1,2})?/g) || []).filter((n) => {
    const v = parseFloat(n);
    return v >= 0 && v <= 20;
  });
  let rest = line;
  if (regMatch) rest = rest.replace(regMatch[0], ' ');
  rest = rest.replace(/\d{1,2}(?:\.\d{1,2})?/g, ' ').replace(/[^A-Za-z .]/g, ' ').replace(/\s+/g, ' ').trim();
  const nameTokenCount = rest.split(' ').filter(Boolean).length;
  if (!numTokens.length || !(regMatch || nameTokenCount >= 2)) return null;
  const mark = parseFloat(numTokens[numTokens.length - 1]);
  return { reg: regMatch ? regMatch[0].toUpperCase() : '', name: rest, mark };
}

/* ===================== AR: Marks & Results (course-first workflow) =====
   Landing view lays out every course unit as a card. Tapping one opens its
   Year/Semester + drop zone so the AR can drag in a single PDF holding a
   full class's marks — the same fuzzy-matching engine used before then
   distributes each score straight to the right student account. */
/* ===================== AR: Marks & Results (program-first workflow) =====
   Program → Year → Semester → Course unit → PDF drop. Each step narrows
   things down; the final drop zone reuses the same fuzzy-matching engine
   to distribute a class's marks straight to student accounts. */
/* Custom programs added by an AR at runtime (e.g. a newly introduced
   course) are kept in shared storage — 'shared' so every AR account sees
   the same list, on any device, without redeploying the app. */
function useCustomPrograms() {
  const [customPrograms, setCustomPrograms] = useState([]);
  useEffect(() => {
    let alive = true;
    window.storage.get('custom_programs', true)
      .then((res) => {
        if (!alive || !res || !res.value) return;
        try { setCustomPrograms(JSON.parse(res.value)); } catch (e) { /* ignore corrupt data */ }
      })
      .catch(() => {});
    return () => { alive = false; };
  }, []);

  const addProgram = async (prog) => {
    const next = [...customPrograms, prog];
    setCustomPrograms(next);
    try { await window.storage.set('custom_programs', JSON.stringify(next), true); } catch (e) { /* offline — kept locally in state */ }
  };

  return { customPrograms, addProgram };
}

  // course units only. If none are set up for this slot, skip straight to
  // the PDF drag & drop instead of asking the AR to define one.
  const courseEntries = Object.entries(CODES)
    .filter(([code]) => {
      if (PROGRAM_OF_CODE[code] !== program) return false;
      const cys = COURSE_YEAR_SEM[code] || {};
      return cys.year === year && cys.sem === sem;
    })
    .map(([code, name]) => ({ code, name }));

  if (courseEntries.length === 0) {
    const genericCode = program + '-Y' + year + 'S' + sem;
    return (
      <ARCourseMarksUpload
        students={students}
        courseCode={genericCode}
        courseName={program + ' · Year ' + year + ' · Semester ' + sem}
        year={year}
        sem={sem}
        onBack={() => setSem(null)}
      />
    );
  }

  return (
    <div className="space-y-4 max-w-4xl">
      <button onClick={() => setSem(null)} className="text-xs font-semibold text-blue-800 hover:underline flex items-center gap-1">
        <ArrowLeft size={13}/> Program: {program} · Year {year} · Semester {sem}
      </button>
      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h4 className="font-semibold text-slate-700 text-xs mb-3 uppercase tracking-wide">Course units</h4>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          {courseEntries.map(({ code, name }) => (
            <button key={code} onClick={() => setActiveCourse({ code, name })}
              className="text-left p-3 rounded-xl border border-slate-200 hover:border-blue-700/60 hover:bg-blue-50/40 transition-colors">
              <p className="text-xs font-mono text-slate-400">{code}</p>
              <p className="text-sm font-semibold text-slate-800">{name}</p>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function ARCourseMarksUpload({ students, courseCode, courseName, year: fixedYear, sem: fixedSem, onBack }) {
  const roster = useMemo(() => (students || []).map((s) => ({ reg: s.reg, name: s.name })), [students]);
  const [year] = useState(fixedYear || (COURSE_YEAR_SEM[courseCode] || {}).year || 1);
  const [sem] = useState(fixedSem || (COURSE_YEAR_SEM[courseCode] || {}).sem || 1);
  const [dragOver, setDragOver] = useState(false);
  const [processing, setProcessing] = useState(false);
  const [scanPages, setScanPages] = useState([]); // pages with no extractable text — need manual entry
  const [rows, setRows] = useState([]); // {id, reg, name, mark, matchedReg, status}
  const [saved, setSaved] = useState(null);
  const [error, setError] = useState('');

  function addRows(newRows) {
    setRows((prev) => [...prev, ...newRows]);
  }

  function matchRow(r) {
    const found = findBestStudentMatch(r.reg || r.name, roster);
    return {
      ...r,
      id: r.id || Math.random().toString(36).slice(2),
      matchedReg: found ? found.student.reg : '',
      matchedName: found ? found.student.name : '',
      status: found ? (found.method === 'reg' ? 'matched' : 'matched-by-name') : 'unmatched',
    };
  }

  async function handleFiles(fileList) {
    setError('');
    setSaved(null);
    setProcessing(true);
    try {
      for (const file of fileList) {
        const lower = file.name.toLowerCase();
        const isPdf = file.type === 'application/pdf' || lower.endsWith('.pdf');
        const isDoc = lower.endsWith('.docx') || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
        if (isPdf) {
          if (!window['pdfjsLib']) {
            setError('PDF engine failed to load — check your connection and try again.');
            continue;
          }
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const lines = await extractPdfPageLines(page);
            const bodyText = lines.join(' ');
            if (bodyText.length < 40) {
              const img = await renderPdfPageToDataUrl(page, 1.3);
              setScanPages((prev) => [...prev, { id: Math.random().toString(36).slice(2), file: file.name, page: i, img }]);
              continue;
            }
            const parsed = lines.map(parseMarksLine).filter(Boolean);
            addRows(parsed.map(matchRow));
          }
        } else if (isDoc) {
          if (!window['mammoth']) {
            setError('Word-document reading isn\u2019t available right now \u2014 please export the marks list as a PDF instead.');
            continue;
          }
          const buf = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: buf });
          const lines = (result.value || '').split('\n').map((s) => s.trim()).filter(Boolean);
          const parsed = lines.map(parseMarksLine).filter(Boolean);
          addRows(parsed.map(matchRow));
        }
        // other file types are silently ignored
      }
    } catch (e) {
      console.error(e);
      setError('Could not read that file \u2014 it may be corrupted, password-protected, or in an unsupported format.');
    }
    setProcessing(false);
  }

  function onDrop(e) {
    e.preventDefault();
    setDragOver(false);
    handleFiles(Array.from(e.dataTransfer.files || []));
  }

  function updateRow(id, patch) {
    setRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  }
  function removeRow(id) {
    setRows((prev) => prev.filter((r) => r.id !== id));
  }

  const resolvable = rows.filter((r) => r.matchedReg && !isNaN(r.mark));

  async function commit() {
    setSaved(null);
    const records = resolvable.map((r) => ({
      reg: r.matchedReg,
      name: r.matchedName,
      year,
      sem,
      marks: { [courseCode]: r.mark },
    }));
    if (!records.length) return;
    await pushMarksOverlay(records);
    setSaved(records.length);
    setRows([]);
  }

  return (
    <div className="space-y-5 max-w-4xl">
      <button onClick={onBack} className="text-xs font-semibold text-blue-800 hover:underline flex items-center gap-1">
        <ArrowLeft size={13}/> Course units
      </button>
      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h3 className="font-bold text-slate-800 text-sm mb-1 flex items-center gap-2"><Upload size={15}/> {courseCode} — {courseName || CODES[courseCode]}</h3>
        <p className="text-xs text-slate-500 mb-4">
          Drag in one PDF or Word doc with the whole class's marks — a table of registration numbers or names next to scores.
          Typed PDFs and Word docs are read automatically; scanned or handwritten pages are flagged below for quick manual entry,
          and every row is auto-matched to a student.
        </p>
        <div className="flex gap-2 mb-4">
          <span className="text-xs font-semibold bg-slate-100 text-slate-600 rounded-full px-3 py-1">Year {year}</span>
          <span className="text-xs font-semibold bg-slate-100 text-slate-600 rounded-full px-3 py-1">Semester {sem}</span>
        </div>
        <label
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={onDrop}
          className={'flex flex-col items-center justify-center gap-2 border-2 border-dashed rounded-2xl py-10 cursor-pointer transition-colors ' + (dragOver ? 'border-emerald-500 bg-emerald-50/50' : 'border-slate-300 hover:border-slate-400')}
        >
          <Upload size={22} className="text-slate-400" />
          <span className="text-sm font-semibold text-slate-600">Drag & drop the full-year marks PDF or Word doc here, or click to choose</span>
          <span className="text-[11px] text-slate-400">Every row will be matched and saved as {courseName || CODES[courseCode] || courseCode}</span>
          <input type="file" accept=".pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple className="hidden"
            onChange={(e) => handleFiles(Array.from(e.target.files || []))} />
        </label>
        {processing && <p className="text-xs text-blue-700 font-semibold mt-3">Assistant is reading the file and matching students…</p>}
        {error && (
          <div className="mt-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
            <AlertCircle size={14} className="mt-0.5 flex-shrink-0" /><span>{error}</span>
          </div>
        )}
        {saved != null && (
          <div className="mt-3 flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold rounded-lg px-3 py-2">
            <CheckCircle2 size={14} /> Saved marks for {saved} student{saved === 1 ? '' : 's'} — they'll see this next time they open Results.
          </div>
        )}
      </div>

      {scanPages.length > 0 && (
        <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
          <h4 className="font-semibold text-slate-800 text-sm mb-1 flex items-center gap-2"><FileText size={15}/> Needs manual entry</h4>
          <p className="text-xs text-slate-500 mb-3">These pages had no readable text (scanned or handwritten). Check the image, then add each mark below.</p>
          <div className="space-y-4">
            {scanPages.map((p) => (
              <ManualScanRow key={p.id} page={p} roster={roster} onAdd={(row) => addRows([matchRow(row)])} />
            ))}
          </div>
        </div>
      )}

      {rows.length > 0 && (
        <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
          <h4 className="font-semibold text-slate-800 text-sm mb-1">Review before saving ({rows.length} row{rows.length === 1 ? '' : 's'})</h4>
          <div className="flex items-start gap-2 bg-blue-50 border border-blue-200 text-blue-800 text-xs rounded-lg px-3 py-2 mb-3">
            <MessageCircle size={14} className="mt-0.5 flex-shrink-0" />
            <span>
              Assistant: matched {rows.filter((r) => r.status === 'matched').length} row{rows.filter((r) => r.status === 'matched').length === 1 ? '' : 's'} by registration number
              and {rows.filter((r) => r.status === 'matched-by-name').length} by name.
              {rows.filter((r) => r.status === 'unmatched').length > 0
                ? ' ' + rows.filter((r) => r.status === 'unmatched').length + ' need' + (rows.filter((r) => r.status === 'unmatched').length === 1 ? 's' : '') + ' your review below before saving.'
                : ' Everything matched — just check the marks look right, then save.'}
            </span>
          </div>
          <div className="overflow-x-auto -mx-2">
            <table className="w-full text-xs">
              <thead>
                <tr className="text-left text-slate-400">
                  <th className="px-2 py-1 font-semibold">Extracted</th>
                  <th className="px-2 py-1 font-semibold">Matched student</th>
                  <th className="px-2 py-1 font-semibold">Mark</th>
                  <th className="px-2 py-1 font-semibold"></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.id} className="border-t border-slate-200/70">
                    <td className="px-2 py-1.5 text-slate-600">{r.reg || r.name}</td>
                    <td className="px-2 py-1.5">
                      {r.status === 'unmatched' ? (
                        <select className={inputCls + ' py-1 text-xs'} value={r.matchedReg}
                          onChange={(e) => {
                            const s = roster.find((x) => x.reg === e.target.value);
                            updateRow(r.id, { matchedReg: s ? s.reg : '', matchedName: s ? s.name : '', status: s ? 'manual' : 'unmatched' });
                          }}>
                          <option value="">— pick student —</option>
                          {roster.map((s) => <option key={s.reg} value={s.reg}>{s.name} ({s.reg})</option>)}
                        </select>
                      ) : (
                        <span className={'font-medium ' + (r.status === 'matched' ? 'text-emerald-700' : 'text-amber-700')}>
                          {r.matchedName} <span className="text-slate-400 font-normal">({r.matchedReg})</span>
                        </span>
                      )}
                    </td>
                    <td className="px-2 py-1.5">
                      <input type="number" step="0.1" className={inputCls + ' py-1 w-20 text-xs'} value={r.mark}
                        onChange={(e) => updateRow(r.id, { mark: parseFloat(e.target.value) })} />
                    </td>
                    <td className="px-2 py-1.5">
                      <button onClick={() => removeRow(r.id)} className="text-slate-400 hover:text-rose-600"><X size={14} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex items-center justify-between mt-4">
            <p className="text-xs text-slate-400">{resolvable.length} of {rows.length} rows are ready to save.</p>
            <button onClick={commit} disabled={!resolvable.length}
              className="bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 disabled:opacity-40 shadow-md shadow-emerald-900/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg px-4 py-2 text-xs">
              Save {resolvable.length} mark{resolvable.length === 1 ? '' : 's'} to student accounts
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================== ADMIN: Performance analytics ===================== */
function gradeStats(records) {
  const graded = records.filter((r) => r.grade);
  const counts = { Distinction: 0, Credit: 0, Pass: 0, Fail: 0 };
  graded.forEach((r) => { counts[r.grade] = (counts[r.grade] || 0) + 1; });
  const total = graded.length;
  const passCount = counts.Distinction + counts.Credit + counts.Pass;
  const avg = total ? graded.reduce((sum, r) => sum + (r.avg || 0), 0) / total : 0;
  return {
    total,
    pending: records.length - total,
    counts,
    passRate: total ? Math.round((passCount / total) * 100) : 0,
    avg: Math.round(avg * 100) / 100,
  };
}

function overallPerformance() {
  const latest = {};
  RESULTS.forEach((r) => {
    const rank = r.year * 10 + r.sem;
    if (!latest[r.reg] || rank > latest[r.reg].rank) latest[r.reg] = { ...r, rank };
  });
  return gradeStats(Object.values(latest));
}

function yearPerformance(yr) {
  const latest = {};
  RESULTS.filter((r) => r.year === yr).forEach((r) => {
    if (!latest[r.reg] || r.sem > latest[r.reg].sem) latest[r.reg] = r;
  });
  return gradeStats(Object.values(latest));
}

}

function ApplicationDocPreview({ doc }) {
  const [text, setText] = useState(null);
  const [busy, setBusy] = useState(false);
  const isPdf = doc.dataUrl.startsWith('data:application/pdf') || doc.name.toLowerCase().endsWith('.pdf');
  const isImage = doc.dataUrl.startsWith('data:image');

  async function extract() {
    if (!window['pdfjsLib']) { setText('PDF engine unavailable — open the file to view it.'); return; }
    setBusy(true);
    try {
      const bytes = dataUrlToUint8Array(doc.dataUrl);
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      let allLines = [];
      for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
        const page = await pdf.getPage(i);
        const lines = await extractPdfPageLines(page);
        allLines = allLines.concat(lines);
      }
      setText(allLines.join('\n') || 'No selectable text found — this may be a scanned image. Open the file to view it.');
    } catch (e) {
      setText('Could not read this PDF automatically — open it to view.');
    }
    setBusy(false);
  }

  return (
    <div className="border border-slate-200 rounded-lg p-3">
      <div className="flex items-center justify-between mb-2 gap-2">
        <p className="text-xs font-semibold text-slate-700 truncate">{doc.name}</p>
        <a href={doc.dataUrl} download={doc.name} className="text-xs text-blue-800 font-semibold hover:underline flex-shrink-0">Open</a>
      </div>
      {isImage && <img src={doc.dataUrl} alt={doc.name} className="max-h-64 rounded-lg border border-slate-100" />}
      {isPdf && (
        <>
          {!text && (
            <button onClick={extract} disabled={busy} className="text-xs text-blue-800 font-semibold hover:underline">
              {busy ? 'Reading…' : 'Assistant: extract text preview'}
            </button>
          )}
          {text && <pre className="text-[11px] text-slate-600 whitespace-pre-wrap bg-slate-50 rounded-lg p-2 mt-1 max-h-40 overflow-y-auto">{text}</pre>}
        </>
      )}
    </div>
  );
}

  const [busy, setBusy] = useState(false);
  const [reason, setReason] = useState('');
  const [mode, setMode] = useState(null); // null | 'reject'

  async function approve() {
    setBusy(true);
    const prn = { prn: genPRN(), amount: COMMITMENT_FEE, status: 'pending', createdAt: Date.now(), expiry: Date.now() + 14 * 24 * 3600 * 1000 };
    const fresh = await dbUpdateApplication(app.id, {
      status: 'approved',
      prn,
      reviewed_at: Date.now(),
      reviewed_by: ar.name || ar.email,
    });
    setBusy(false);
    if (fresh) onUpdated(fresh);
    onClose();
  }

  async function reject() {
    setBusy(true);
    const fresh = await dbUpdateApplication(app.id, {
      status: 'rejected',
      review_note: reason.trim(),
      reviewed_at: Date.now(),
      reviewed_by: ar.name || ar.email,
    });
    setBusy(false);
    if (fresh) onUpdated(fresh);
    onClose();
