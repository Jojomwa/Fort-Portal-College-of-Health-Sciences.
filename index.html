  body::after {
    content: '';
    position: fixed;
    z-index: 0;
    width: 480px;
    height: 480px;
    border-radius: 9999px;
    filter: blur(110px);
    pointer-events: none;
    bottom: -180px;
    right: -120px;
    background: radial-gradient(circle, color-mix(in srgb, var(--portal-accent), transparent 78%), transparent 70%);
    animation: bgBlobDrift 16s ease-in-out infinite;
  }
  @keyframes bgBlobDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(3%, -2%) scale(1.08); }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* ======================================================================
     CINEMATIC INTERIOR — the logged-in app (sidebar, header, dashboard
     cards, section content) gets the same depth/light/motion language as
     the splash and gate screens: staggered entrances, ambient drifting
     glow, and soft physical press feedback.
     ====================================================================== */

  /* Ambient glow blobs that live behind the main content column, giving
     the white/glass cards something to float over besides flat white. */
  .cine-ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .cine-ambient span {
    position: absolute;
    border-radius: 9999px;
    filter: blur(90px);
    opacity: 0.55;
  }
  .cine-ambient span:nth-child(1) {
    width: 360px; height: 360px; top: -120px; right: -80px;
    background: radial-gradient(circle, rgba(16,185,129,0.28), transparent 70%);
    animation: cineBlobDrift1 18s ease-in-out infinite;
  }
  .cine-ambient span:nth-child(2) {
    width: 320px; height: 320px; bottom: -140px; left: -100px;
    background: radial-gradient(circle, rgba(37,99,235,0.22), transparent 70%);
    animation: cineBlobDrift2 22s ease-in-out infinite;
  }
  @keyframes cineBlobDrift1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-4%, 3%) scale(1.1); }
  }
  @keyframes cineBlobDrift2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(4%, -3%) scale(1.08); }
  }

  /* Section-level crossfade: re-keying the content wrapper on nav change
     re-triggers this animation, giving a cinematic transition between
     dashboard pages instead of an instant hard cut. */
  @keyframes cineSectionIn {
    from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .cine-section { animation: cineSectionIn .5s cubic-bezier(.22,1,.36,1) both; position: relative; z-index: 1; }

  /* Staggered card entrance + interactive depth. Applied to stat tiles,
     fee bars, and other card-like blocks inside the dashboard. */
  @keyframes cineCardIn {
    from { opacity: 0; transform: translateY(18px) scale(.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .cine-card {
    animation: cineCardIn .55s cubic-bezier(.22,1,.36,1) both;
    transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
  }
  .cine-card:hover { transform: translateY(-3px) scale(1.015); }
  .cine-card:active { transform: translateY(0) scale(.98); transition-duration: .1s; }
  .cine-stagger-1 { animation-delay: .03s; }
  .cine-stagger-2 { animation-delay: .09s; }
  .cine-stagger-3 { animation-delay: .15s; }
  .cine-stagger-4 { animation-delay: .21s; }
  .cine-stagger-5 { animation-delay: .27s; }
  .cine-stagger-6 { animation-delay: .33s; }

  /* Sidebar: slide/fade in on mount, active item gets a breathing glow. */
  @keyframes cineSidebarIn {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .cine-sidebar { animation: cineSidebarIn .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes cineNavGlow {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 rgba(16,185,129,0); }
    50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 18px rgba(16,185,129,.45); }
  }
  .cine-nav-active { animation: cineNavGlow 2.6s ease-in-out infinite; }
  .cine-nav-item { transition: transform .18s ease, background-color .18s ease; }
  .cine-nav-item:hover { transform: translateX(3px); }
  .cine-nav-item:active { transform: translateX(1px) scale(.98); }

  /* Header/navbar: gentle drop-in so it feels like it's settling into
     place above the parallax backdrop rather than just appearing. */
  @keyframes cineHeaderIn {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .cine-header { animation: cineHeaderIn .5s cubic-bezier(.22,1,.36,1) both; }

  /* Buttons/CTAs across the dashboard get a subtle physical press. */
  .cine-press { transition: transform .15s ease, filter .15s ease; }
  .cine-press:active { transform: scale(.96); filter: brightness(.96); }

  @keyframes gateBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gateCardIn {
    0% { opacity: 0; transform: translateY(36px) scale(.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes gateBadgeIn {
    0% { opacity: 0; transform: scale(.4) rotate(-8deg); }
    65% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes gateFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes gateAvatarIn {
    0% { opacity: 0; transform: translateY(22px) scale(.5); }
    70% { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes gateGlowDrift {
    0%, 100% { opacity: .6; transform: translateX(0); }
    50% { opacity: .9; transform: translateX(3%); }
  }

  /* ---- App boot / splash animations ---- */
  @keyframes splashBgIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes splashRingSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes splashLogoPop {
    0% { opacity: 0; transform: scale(.3) rotate(-12deg); filter: blur(6px); }
    55% { opacity: 1; transform: scale(1.12) rotate(3deg); filter: blur(0); }
    75% { transform: scale(.96) rotate(-1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes splashTextIn {
    from { opacity: 0; transform: translateY(10px) scale(.96); letter-spacing: .3em; }
    to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: .05em; }
  }
  @keyframes splashBarFill {
    from { width: 0%; }
    to { width: 100%; }
  }
  @keyframes splashShimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(220%); }
  }
  @keyframes splashOut {
    0% { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(1.06); filter: blur(6px); }
  }
  @keyframes gateCardInFromSplash {
    0% { opacity: 0; transform: translateY(10px) scale(.985); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---- Fancy press feedback used by role avatar buttons ---- */
  @keyframes avatarRippleOut {
    0% { opacity: .55; transform: scale(.2); }
    100% { opacity: 0; transform: scale(1.9); }
  }
  @keyframes avatarSettle {
    0% { transform: scale(1.16) rotate(0deg); }
    45% { transform: scale(.94) rotate(-2deg); }
    70% { transform: scale(1.04) rotate(1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ---- Liquid-glass tiles & bars ---------------------------------------
     Reusable "embossed glass" look (soft frosted card with a diagonal
     sheen + inset highlight/shadow bezel) used for the overview stat
     tiles, fee bars, and the Generate PRN panel. */
  .glass-tile {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(226,232,240,0.60) 0%, rgba(148,163,184,0.30) 55%, rgba(226,232,240,0.50) 100%);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.75),
      inset 0 -10px 18px -8px rgba(15,23,42,0.22),
      0 12px 26px -10px rgba(2,6,23,0.55);
  }
  .glass-tile::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 62%, rgba(255,255,255,0.22) 100%);
    pointer-events: none;
  }
  .glass-tile > * { position: relative; z-index: 1; }

  .glass-bar-red {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -10px 16px -6px rgba(0,0,0,0.35),
      0 10px 22px -8px rgba(127,29,29,0.6);
  }
  .glass-bar-blue {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #1e3a8a 0%, #0b1541 100%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -10px 16px -6px rgba(0,0,0,0.35),
      0 10px 22px -8px rgba(11,21,65,0.6);
  }
  .glass-bar-red::before, .glass-bar-blue::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 35%);
    pointer-events: none;
  }
  .glass-bar-red > *, .glass-bar-blue > * { position: relative; z-index: 1; }

  .glass-btn-dark {
    background: linear-gradient(180deg, #64748b 0%, #334155 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -8px 14px -6px rgba(0,0,0,0.35),
      0 10px 20px -8px rgba(15,23,42,0.55);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .glass-btn-dark:active { transform: scale(0.97); }

  /* ---- Discorectangle liquid-glass nav bar ------------------------------
     Floating stadium/pill-shaped app bar with a frosted, sheen-lit glass
     surface (same family as .glass-tile but darker, to match a translucent
     "liquid screen" material sitting on the starfield backdrop). */
  .glass-navbar {
    position: relative;
    /* no overflow:hidden here — bell/avatar dropdowns render below this
       bar and must not be clipped by it. The sheen pseudo-element below
       carries its own matching border-radius instead. */
    border-radius: 9999px;
    background: linear-gradient(160deg, rgba(71,85,105,0.55) 0%, rgba(15,23,42,0.55) 55%, rgba(51,65,85,0.50) 100%);
    border: 1px solid rgba(255,255,255,0.20);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    backdrop-filter: blur(26px) saturate(140%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.28),
      inset 0 -10px 18px -10px rgba(0,0,0,0.45),
      0 14px 32px -12px rgba(2,6,23,0.65);
  }
  .glass-navbar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    background: linear-gradient(115deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 65%, rgba(255,255,255,0.12) 100%);
    pointer-events: none;
  }
  .glass-navbar > * { position: relative; z-index: 1; }

  /* ---- Readability fix -------------------------------------------------
     The app leans on very light Tailwind grays (slate-300/400/500) for
     labels, timestamps and helper text, sitting on light "glass" cards
     (bg-white/40 … bg-white/80). At small sizes those pairings fall well
     below WCAG AA contrast (as low as ~2:1) and are hard to read on top
     of the busy animated background showing through the blur.

     Rather than hand-editing every one of the ~90 occurrences in the
     markup, this scopes darker replacement colors to just the elements
     that sit inside a light card, using normal CSS specificity to win
     over the single-class Tailwind utility — so text on dark surfaces

/* ======================= window.storage client =========================
   This build talks to Supabase directly (project:
   Fort-Portal-College-of-Health-Sciences-backend) through a generic
   key/value table called kv_store, using the exact same get/set/delete/list
   surface the rest of this app already calls. That means:
     - shared=true data (results overlays, the Registrar record, etc.) is
       one row per key, visible to everyone who loads the site.
     - shared=false ("personal") data is scoped per device using the same
       acmis_device_token this file already generates and stores in
       localStorage for the Registrar device-binding feature.
   Caveat (same one already noted above for device binding): there's no
   real backend enforcing who can read/write what — the Supabase anon key
   embedded below is public, by design, and every browser that loads this
   page can read or write any row. That's the same trust model this file
   already had when everything lived in localStorage; the difference now
   is that data syncs across devices and survives a cleared browser,
   instead of living in just one browser. Locking this down for real would
   mean adding actual user accounts (e.g. Supabase Auth) and moving
   privileged writes (like Registrar/admin actions) behind a server-side
   check instead of a client-side role flag.
   Falls back to localStorage if Supabase can't be reached, so the app
   still works offline. */
if (!window.storage) {
  const SUPABASE_URL = 'https://exaznrehkfoxszcpxwyq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_X0LhIlfxeXC2n1zPvXDvrw_ZTF5upK_';
  let backendReachable = true;
  let sbClient = null;

  function getDeviceId() {
    try {
      let t = localStorage.getItem('acmis_device_token');
      if (!t) {
        t = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem('acmis_device_token', t);
      }
      return t;
    } catch (e) {
      return 'no-storage-' + Math.random().toString(36).slice(2);
    }
  }

  function getClient() {
    if (!sbClient) {
      if (!window.supabase || !window.supabase.createClient) return null;
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    return sbClient;
  }

  // Expose the SAME client instance for auth (sign in / sign up / sign out /
  // password reset) so we don't spin up a second GoTrue client. Anything
  // outside this IIFE should call getAuthClient() (defined below), not
  // reference `supabase` directly — that name is the raw library namespace
  // from the CDN script, not a usable client.
  window.__acmisGetAuthClient = getClient;

  const localFallback = {
    async get(key, shared) {
      const raw = localStorage.getItem((shared ? 'shared:' : 'personal:') + key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem((shared ? 'shared:' : 'personal:') + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      const k = (shared ? 'shared:' : 'personal:') + key;
      const existed = localStorage.getItem(k) !== null;
      localStorage.removeItem(k);
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared) {
      const pfx = (shared ? 'shared:' : 'personal:') + (prefix || '');
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(pfx) === 0) keys.push(k.slice((shared ? 'shared:' : 'personal:').length));
      }
      return { keys, prefix: prefix || null, shared: !!shared };
    },
  };

  window.storage = {
    async get(key, shared) {
      if (!backendReachable) return localFallback.get(key, shared);
      try {
        const client = getClient();
        if (!client) throw new Error('Supabase client library not loaded');
        let query = client.from('kv_store').select('value').eq('store_key', key).eq('shared', !!shared);
        query = shared ? query : query.eq('device_id', getDeviceId());
        const { data, error } = await query.maybeSingle();
        if (error) throw error;
        if (!data) return null;
        return { key, value: data.value, shared: !!shared };
      } catch (e) {
        console.warn('ACMIS backend (Supabase) unreachable, falling back to localStorage.', e);
        backendReachable = false;
        return localFallback.get(key, shared);
      }
    },
    async set(key, value, shared) {
      if (!backendReachable) return localFallback.set(key, value, shared);
      try {
        const client = getClient();
        if (!client) throw new Error('Supabase client library not loaded');
        const row = {
          store_key: key,
          value,
          shared: !!shared,
          device_id: shared ? null : getDeviceId(),
        };
        const onConflict = shared ? 'store_key' : 'store_key,device_id';
        const { error } = await client.from('kv_store').upsert(row, { onConflict });
        if (error) throw error;
        return { key, value, shared: !!shared };
      } catch (e) {
        console.warn('ACMIS backend (Supabase) unreachable, falling back to localStorage.', e);
        backendReachable = false;
        return localFallback.set(key, value, shared);
      }
    },
    async delete(key, shared) {
      if (!backendReachable) return localFallback.delete(key, shared);
      try {
        const client = getClient();
        if (!client) throw new Error('Supabase client library not loaded');
        let query = client.from('kv_store').delete().eq('store_key', key).eq('shared', !!shared);
        query = shared ? query : query.eq('device_id', getDeviceId());
        const { error } = await query;
        if (error) throw error;
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        console.warn('ACMIS backend (Supabase) unreachable, falling back to localStorage.', e);
        backendReachable = false;
        return localFallback.delete(key, shared);
      }
    },
    async list(prefix, shared) {
      if (!backendReachable) return localFallback.list(prefix, shared);
      try {
        const client = getClient();
        if (!client) throw new Error('Supabase client library not loaded');
        let query = client.from('kv_store').select('store_key').eq('shared', !!shared);
        query = shared ? query : query.eq('device_id', getDeviceId());
        if (prefix) query = query.like('store_key', prefix + '%');
        const { data, error } = await query;
        if (error) throw error;
        return { keys: (data || []).map((r) => r.store_key), prefix: prefix || null, shared: !!shared };
      } catch (e) {
        console.warn('ACMIS backend (Supabase) unreachable, falling back to localStorage.', e);
        backendReachable = false;
        return localFallback.list(prefix, shared);
      }
    },
  };
}

   sign out, and password reset all go through this one client. */
function getAuthClient() {

/* ===================== ADMISSIONS: SUPABASE DATA LAYER =====================
   Applications and selection criteria live in real Postgres tables (see the
   SQL migration in /docs or the setup message), not the generic kv_store
   blob table — this is what makes server-side filtering/auto-selection
   possible. All reads/writes go through these helpers. */
async function dbListApplications() {
  const client = getAuthClient();
  const { data, error } = await client.from('applications').select('*').order('submitted_at', { ascending: false });
  if (error) { console.error('dbListApplications failed', error); return []; }
  return data || [];
}
async function dbGetApplication(id) {
  const client = getAuthClient();
  const { data, error } = await client.from('applications').select('*').eq('id', id).maybeSingle();
  if (error) { console.error('dbGetApplication failed', error); return null; }
  return data;
}
// Applicant self-service (no account): looks up an application by reference
// + the email it was submitted with. Goes through a SECURITY DEFINER RPC
// since the applications table has no general anon SELECT policy (that
// would let anyone scrape every applicant's contact info and documents).
async function dbLookupApplicationSelf(ref, email) {
  const client = getAuthClient();
  const { data, error } = await client.rpc('lookup_application', { p_ref: ref, p_email: email });
  if (error) { console.error('dbLookupApplicationSelf failed', error); return null; }
  return (data && data[0]) || null;
}
// Applicant self-service payment confirmation, verified server-side
// (ref + email + PRN match, not expired) via the same RPC pattern.
async function dbConfirmApplicationPaymentSelf(ref, email, prn) {
  const client = getAuthClient();
  const { data, error } = await client.rpc('confirm_application_payment', { p_ref: ref, p_email: email, p_prn: prn });
  if (error) { console.error('dbConfirmApplicationPaymentSelf failed', error); return null; }
  return (data && data[0]) || null;
}
async function dbInsertApplication(record) {
  const client = getAuthClient();

  if (error) { console.error('dbInsertApplication failed', error); return false; }
  return true;
}

  const client = getAuthClient();

  if (error) { console.error('dbUpdateApplication failed', error); return null; }
  return data;
}
async function dbGetCriteria() {
  const client = getAuthClient();
  const { data, error } = await client.from('admission_criteria').select('*').eq('id', 1).maybeSingle();
  if (error || !data) return { id: 1, min_points: null, min_age: null, max_age: null, locations: [], updated_at: null, updated_by: '' };
  return data;
}

  const client = getAuthClient();

  if (error) console.error('dbSaveCriteria failed', error);
  return !error;
}

// UACE-style points per subject grade (A=6 ... F=0). Applicants self-report a free-text
// results summary rather than structured grades, so points are estimated by scanning that
// text for grade letters — shown to the Registrar as an estimate, not a hard number.
const UACE_GRADE_POINTS = { A: 6, B: 5, C: 4, D: 3, E: 2, O: 1, F: 0 };
function calcPointsFromSummary(text) {
  if (!text) return 0;
  const afterColon = [...text.matchAll(/:\s*([A-FOa-fo])\b/g)].map((m) => m[1].toUpperCase());
  const tokens = afterColon.length ? afterColon : (text.match(/\b[A-FOa-fo]\b/g) || []).map((t) => t.toUpperCase());
  return tokens.reduce((sum, g) => sum + (UACE_GRADE_POINTS[g] ?? 0), 0);
}

// Evaluates one application against the active criteria. Any criterion left blank/empty
// is simply not enforced. Returns the recommendation plus a human-readable failure log.
function evaluateApplication(app, criteria) {
  const points = typeof app.calculated_points === 'number' ? app.calculated_points : calcPointsFromSummary(app.results_summary);
  const failed = [];

  if (criteria.min_points != null && criteria.min_points !== '') {
    if (points < Number(criteria.min_points)) failed.push(`Points below ${criteria.min_points} (has ${points})`);
  }
  if (criteria.min_age != null && criteria.min_age !== '') {
    if (!(app.age >= Number(criteria.min_age))) failed.push(`Age below ${criteria.min_age} (is ${app.age ?? '—'})`);
  }
  if (criteria.max_age != null && criteria.max_age !== '') {
    if (!(app.age <= Number(criteria.max_age))) failed.push(`Age above ${criteria.max_age} (is ${app.age ?? '—'})`);
  }
  if (criteria.locations && criteria.locations.length > 0) {
    const loc = (app.location || '').toLowerCase();
    const match = criteria.locations.some((d) => loc.includes(d.toLowerCase()) || d.toLowerCase().includes(loc));
    if (!match) failed.push(`Location "${app.location || '—'}" not in target list`);
  }

  return { calculated_points: points, auto_status: failed.length === 0 ? 'QUALIFIED' : 'REJECTED', failed_criteria: failed };
}

// The Evaluation Engine: re-tags every application against the current criteria, skipping
// anything the Registrar has already manually overridden so it can never be bumped back.
async function runAutoSelection(criteria) {
  const apps = await dbListApplications();
  let qualified = 0, rejected = 0, skipped = 0;
  for (const app of apps) {
    if (app.is_manual_override) { skipped++; continue; }
    const result = evaluateApplication(app, criteria);
    await dbUpdateApplication(app.id, result);
    if (result.auto_status === 'QUALIFIED') qualified++; else rejected++;
  }
  return { total: apps.length, qualified, rejected, skipped };
}

(function buildCourseYearSem() {
  const tally = {};
  RESULTS.forEach((r) => {
    Object.keys(r.marks || {}).forEach((code) => {
      const key = code + '|' + r.year + '|' + r.sem;
      tally[key] = (tally[key] || 0) + 1;
    });
  });
  Object.keys(CODES).forEach((code) => {
    let best = null;
    let bestCount = 0;
    Object.keys(tally).forEach((key) => {
      const [c, y, s] = key.split('|');
      if (c === code && tally[key] > bestCount) {
        bestCount = tally[key];
        best = { year: Number(y), sem: Number(s) };
      }
    });
    COURSE_YEAR_SEM[code] = best || { year: 1, sem: 1 };
  });
})();

/* ===================== REG NUMBER VALIDATION (whitelist) =====================
   Canonical format:
   UAHEB/COURSE/SCHOOL_NO/YOUR_NO/YEAR_OF_ENTRY
   Pharmacy example: UAHEB/PHA/100/077/24

   The course and school number are validated, the student number and
   entry year are extracted, and the normalized value is used everywhere. */
function validateRegNumber(raw) {
  const reg = (raw || '').trim().toUpperCase().replace(/\s+/g, '');
  const m = reg.match(/^UAHEB\/([A-Z0-9]{2,10})\/(\d{3})\/(\d{3})\/(\d{2})$/);

  if (!m) {
    return {
      valid: false,
      reason: 'Reg number must look like UAHEB/PHA/100/077/24.'
    };
  }

  const [, course, schoolNo, studentNo, year] = m;

  if (schoolNo !== '100') {
    return {
      valid: false,
      reason: 'School number must be 100.'
    };
  }

  const supportedCourses = new Set(
    (typeof PROGRAMS !== 'undefined' && Array.isArray(PROGRAMS))
      ? PROGRAMS.map((p) => String(p.id).toUpperCase())
      : ['PHA']
  );

  if (!supportedCourses.has(course)) {
    return {
      valid: false,
      reason: `Unsupported course code "${course}". Use a valid course code such as PHA.`
    };
  }

  const entryYear = 2000 + parseInt(year, 10);
  const normalized = `UAHEB/${course}/${schoolNo}/${studentNo}/${year}`;

  return {
    valid: true,
    reg: normalized,
    course,
    schoolNo,
    studentNo,
    entryYear
  };
}
async function isRegNumberClaimed(reg) {
  // A reg number is "claimed" once a student account exists for it.
  // Falls back to false (unclaimed) if the check can't run, so the flow
  // never hard-blocks signup on a network hiccup — Supabase's own unique
  // constraint on students.reg is the real backstop.
  try {
    const client = getAuthClient();
    const { data, error } = await client.rpc('is_reg_claimed', { p_reg: reg });
    if (error) throw error;
    return !!data;
  } catch (e) {
    return false;
  }
}
function calcAge(dobStr) {
  if (!dobStr) return null;
  const dob = new Date(dobStr);
  if (isNaN(dob.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Could not read file: ' + file.name));
    r.readAsDataURL(file);
  });
}
function dataUrlToUint8Array(dataUrl) {
  const base64 = dataUrl.split(',')[1] || '';
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

}

/* Calls the 'email-otp' Supabase Edge Function, which is what actually

   deploy it (with its required secrets) before this will work. */
async function callOtpFunction(action, payload) {
  const client = getAuthClient();
  const { data, error } = await client.functions.invoke('email-otp', {
    body: { action, ...payload },
  });
  if (error) throw new Error(error.message || 'Request failed. Please try again.');
  if (data && data.ok === false) throw new Error(data.error || 'Request failed. Please try again.');
  return data;
}

    studyPlan: [],
    createdAt: Date.now(),
  };
  await storeSet('ar:' + REGISTRAR_ID, rec, true);
  return rec;
}

async function storeGet(key, shared) {
  try {
    const res = await window.storage.get(key, shared);
    return res ? JSON.parse(res.value) : null;
  } catch (e) {
    return null;
  }
}
async function storeSet(key, val, shared) {
  try {
    await window.storage.set(key, JSON.stringify(val), shared);
    return true;
  } catch (e) {
    console.error('storage set failed', e);
    return false;
  }
}

/* ===================== MARKS OVERLAY (uploaded via Admin) ===================== */
// Marks uploaded through the Admin "Marks Upload" tool don't rewrite the
// baked-in RESULTS dataset — they're layered on top at runtime from
// shared storage, so every browser session (and every student) sees the
// same up-to-date numbers without needing a server.
function computeGradeFromAvg(avg) {
  if (avg == null || isNaN(avg)) return null;
  if (avg >= 14) return 'Distinction';
  if (avg >= 12) return 'Credit';
  if (avg >= 10) return 'Pass';
  return 'Fail';
}
function recomputeAvgGrade(rec) {
  const vals = Object.values(rec.marks || {}).filter((v) => typeof v === 'number' && !isNaN(v));
  if (!vals.length) {
    rec.avg = null;
    rec.grade = null;
    return rec;
  }
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  rec.avg = Math.round(avg * 100) / 100;
  rec.grade = computeGradeFromAvg(rec.avg);
  return rec;
}
function mergeOverlayRecord(rec) {
  if (!resultsByReg[rec.reg]) resultsByReg[rec.reg] = [];
  let existing = resultsByReg[rec.reg].find((r) => r.year === rec.year && r.sem === rec.sem);
  if (existing) {
    Object.assign(existing.marks, rec.marks);
    recomputeAvgGrade(existing);
  } else {
    recomputeAvgGrade(rec);
    resultsByReg[rec.reg].push(rec);
  }
}
// Per-student overlay storage: key 'marks:<reg>' holds only that student's
// records, matching the kv_store RLS policy that lets a student read (but
// not write) 'marks:' + their own reg. Staff can read/write any key.
const loadedMarksRegs = new Set();
async function ensureMarksLoaded(reg) {
  if (!reg || loadedMarksRegs.has(reg)) return false;
  loadedMarksRegs.add(reg);
  try {
    const overlay = (await storeGet('marks:' + reg, true)) || [];
    overlay.forEach(mergeOverlayRecord);
    return overlay.length > 0;
  } catch (e) {
    console.warn('marks overlay load failed for', reg, e);
    return false;
  }
}
async function pushMarksOverlay(newRecords) {
  const byReg = {};
  newRecords.forEach((rec) => { (byReg[rec.reg] = byReg[rec.reg] || []).push(rec); });
  for (const reg of Object.keys(byReg)) {
    loadedMarksRegs.delete(reg); // force a fresh read next time this student's page loads
    const existing = (await storeGet('marks:' + reg, true)) || [];
    byReg[reg].forEach((rec) => {
      const i = existing.findIndex((r) => r.year === rec.year && r.sem === rec.sem);
      if (i >= 0) {
        existing[i].marks = { ...existing[i].marks, ...rec.marks };
      } else {
        existing.push({ reg: rec.reg, name: rec.name, marks: { ...rec.marks }, year: rec.year, sem: rec.sem });
      }
      mergeOverlayRecord({ reg: rec.reg, name: rec.name, marks: { ...rec.marks }, year: rec.year, sem: rec.sem });
    });
    await storeSet('marks:' + reg, existing, true);
    loadedMarksRegs.add(reg); // we're already current for this reg now
  }
}

/* ===================== fuzzy name matching for marks import ===================== */
function normName(s) {
  return (s || '').toUpperCase().replace(/[^A-Z ]/g, '').replace(/\s+/g, ' ').trim();
}
function nameTokenScore(a, b) {
  const ta = new Set(normName(a).split(' ').filter(Boolean));
  const tb = new Set(normName(b).split(' ').filter(Boolean));
  if (!ta.size || !tb.size) return 0;
  let hits = 0;
  ta.forEach((t) => { if (tb.has(t)) hits++; });
  return hits / Math.max(ta.size, tb.size);
}
function findBestStudentMatch(nameOrReg, roster) {
  const cleanedReg = (nameOrReg || '').toUpperCase().replace(/\s+/g, '');
  const exact = roster.find((s) => s.reg.toUpperCase() === cleanedReg);
  if (exact) return { student: exact, score: 1, method: 'reg' };
  let best = null;
  let bestScore = 0;
  roster.forEach((s) => {
    const score = nameTokenScore(nameOrReg, s.name);
    if (score > bestScore) {
      bestScore = score;
      best = s;
    }
  });
  if (best && bestScore >= 0.6) return { student: best, score: bestScore, method: 'name' };
  return null;
}

/* ============================ OTP HELPERS ==============================
   Generates + stores a one-time verification code so "forgot password"
   flows work end-to-end. This build has no live email/SMS gateway wired
   up, so the code is shown on-screen instead of actually being emailed/
   texted — everything else (expiry, verification, resetting the
   password) is fully functional. */
async function requestOtp(channelId) {
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const expires = Date.now() + 10 * 60 * 1000;
  await storeSet('otp:' + channelId, { code, expires }, true);
  return { code, expires };
}
async function verifyOtp(channelId, code) {
  const rec = await storeGet('otp:' + channelId, true);
  if (!rec) return { ok: false, reason: 'No code was requested for this contact.' };
  if (Date.now() > rec.expires) return { ok: false, reason: 'This code has expired. Request a new one.' };
  if (String(rec.code) !== String(code).trim()) return { ok: false, reason: 'Incorrect code. Please try again.' };
  return { ok: true };
}
function maskContact(v) {
  if (!v) return '';
  if (v.includes('@')) {
    const [u, d] = v.split('@');
    return (u[0] || '') + '***@' + d;
  }
  return v.slice(0, 3) + '****' + v.slice(-2);
}
async function storeList(prefix, shared) {
  try {
    const res = await window.storage.list(prefix, shared);
    return (res && res.keys) || [];
  } catch (e) {
    return [];
  }
}

/* ===================== FORGOT PASSWORD (generic, email/phone) ==============
   Works for any account namespace (students, ars, admin) — pass the
   storage key of the account record plus which contact fields it has. */
function ForgotPasswordFlow({ title, findAccount, onClose, onReset }) {
  const [step, setStep] = useState(1); // 1 = find account, 2 = enter code, 3 = new password
  const [idQuery, setIdQuery] = useState('');
  const [contact, setContact] = useState('');
  const [account, setAccount] = useState(null);
  const [code, setCode] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [sendingEmail, setSendingEmail] = useState(false);
  const [emailErr, setEmailErr] = useState('');

  async function lookup() {
    setErr('');
    setBusy(true);
    const acc = await findAccount(idQuery.trim());
    if (!acc) {
      setBusy(false);
      setErr('No account found. Check the ID/registration number and try again.');
      return;
    }
    const contactValue = acc.email || acc.phone;
    if (!contactValue) {
      setBusy(false);
      setErr('This account has no email or phone on file. Ask an administrator to reset it for you.');
      return;
    }
    if (!acc.email) {
      // Phone-only account: there's no SMS provider wired up yet, so be
      // upfront about that instead of faking a code that never arrives.
      setBusy(false);
      setErr('This account only has a phone number on file, and SMS delivery isn\u2019t set up yet. Ask an administrator to reset your password instead.');
      return;
    }
    setAccount(acc);
    setContact(contactValue);
    const { code: c, expires } = await requestOtp(acc.key);
    setBusy(false);
    setStep(2);
    setEmailErr('');
    setSendingEmail(true);
    try {
      await sendOtpEmail(contactValue, c, expires);
    } catch (e) {
      console.error('Failed to send OTP email', e);
      setEmailErr(describeEmailError(e));
    }
    setSendingEmail(false);
  }

  async function resend() {
    if (!account) return;
    setEmailErr('');
    setSendingEmail(true);
    try {
      const { code: c, expires } = await requestOtp(account.key);
      await sendOtpEmail(contact, c, expires);
    } catch (e) {
      console.error('Failed to send OTP email', e);
      setEmailErr(describeEmailError(e));
    }
    setSendingEmail(false);
  }

  async function checkCode() {
    setErr('');
    setBusy(true);
    const res = await verifyOtp(account.key, code);
    setBusy(false);
    if (!res.ok) {
      setErr(res.reason);
      return;
    }
    setStep(3);
  }

  async function resetPw() {
    setErr('');
    if (!pw || pw.length < 4) {
      setErr('Choose a password with at least 4 characters.');
      return;
    }
    if (pw !== pw2) {
      setErr('Passwords do not match.');
      return;
    }
    setBusy(true);
    await onReset(account, pw);
    setBusy(false);
    onClose(true);
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white/70 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-slate-800 text-sm">{title || 'Reset your password'}</h3>
          <button onClick={() => onClose(false)} className="text-slate-400 hover:text-slate-600">
            <X size={18} />
          </button>
        </div>

        {err && (
          <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
            <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
            <span>{err}</span>
          </div>
        )}

        {step === 1 && (
          <>
            <Field label="Registration / staff / login ID">
              <input
                autoFocus
                className={inputCls}
                value={idQuery}
                onChange={(e) => setIdQuery(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && lookup()}
                placeholder="e.g. UAHEB/PHA/100/001/24"
              />
            </Field>
            <button
              onClick={lookup}
              disabled={busy || !idQuery.trim()}
              className="w-full mt-1 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60"
            >
              {busy ? 'Searching…' : 'Continue'}
            </button>
          </>
        )}

        {step === 2 && (
          <>
            <p className="text-xs text-slate-500 mb-3">
              We sent a 6-digit verification code to <strong>{maskContact(contact)}</strong>.
            </p>
            {sendingEmail && (
              <div className="mb-3 bg-slate-50 border border-slate-200 text-slate-600 text-[11px] rounded-lg px-3 py-2">
                Sending your code…
              </div>
            )}
            {!sendingEmail && emailErr && (
              <div className="mb-3 bg-rose-50 border border-rose-200 text-rose-700 text-[11px] rounded-lg px-3 py-2">
                {emailErr}
              </div>
            )}
            {!sendingEmail && !emailErr && (
              <div className="mb-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] rounded-lg px-3 py-2">
                Check your inbox (and spam folder) — the code expires in 10 minutes.
              </div>
            )}
            <Field label="Enter verification code">
              <input
                autoFocus
                className={inputCls + ' tracking-widest text-center font-mono'}
                value={code}
                onChange={(e) => setCode(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && checkCode()}
                maxLength={6}
                placeholder="••••••"
              />
            </Field>
            <button
              onClick={checkCode}
              disabled={busy || sendingEmail || code.length < 6}
              className="w-full bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60"
            >
              {busy ? 'Checking…' : 'Verify Code'}
            </button>
            <button
              onClick={resend}
              disabled={sendingEmail}
              className="w-full mt-2 text-center text-xs text-slate-400 hover:text-slate-600 hover:underline disabled:opacity-60"
            >
              Resend code
            </button>
          </>
        )}

        {step === 3 && (
          <>
            <PasswordField label="New password" value={pw} onChange={setPw} />
            <PasswordField label="Confirm new password" value={pw2} onChange={setPw2} onEnter={resetPw} />
            <button
              onClick={resetPw}
              disabled={busy}
              className="w-full mt-2 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold rounded-xl py-2.5 text-sm disabled:opacity-60 shadow-md shadow-emerald-900/25 active:scale-[0.97] transition-all"
            >
              {busy ? 'Saving…' : 'Set New Password'}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

const THEME_PRESETS = {
  ocean:   { label: 'Ocean Blue', accent: '#2563eb', sidebar: '#0f2a5f', bg: '#eef6ff', card: 'rgba(255,255,255,.68)' },
  emerald: { label: 'Dark Emerald', accent: '#10b981', sidebar: '#063b32', bg: '#071a17', card: 'rgba(10,35,30,.72)' },
  sunset:  { label: 'Sunset Amber', accent: '#f59e0b', sidebar: '#4a2508', bg: '#fff7ed', card: 'rgba(255,255,255,.72)' },
  violet:  { label: 'Royal Violet', accent: '#8b5cf6', sidebar: '#28104f', bg: '#f5f3ff', card: 'rgba(255,255,255,.72)' },
};

function darkenThemeColor(hex) {
  try {
    const h = String(hex).replace('#','');
    const n = parseInt(h, 16);
    const r = Math.max(0, ((n >> 16) & 255) * 0.22);
    const g = Math.max(0, ((n >> 8) & 255) * 0.22);
    const b = Math.max(0, (n & 255) * 0.22);
    return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
  } catch (_) { return '#07110f'; }
}

function applyPortalTheme(theme) {
  const t = theme || {};
  const preset = THEME_PRESETS[t.preset] || THEME_PRESETS.ocean;
  const root = document.documentElement;
  root.dataset.portalTheme = t.preset || 'ocean';
  root.dataset.portalDark = t.dark ? 'true' : 'false';
  root.style.setProperty('--portal-accent', t.accent || preset.accent);
  root.style.setProperty('--portal-sidebar', t.sidebar || preset.sidebar);
  // The page background is part of the selected template too. Dark mode
  // keeps the selected palette but shifts it to a dark version.
  const pageBg = t.dark ? darkenThemeColor(t.bg || preset.bg || '#eef6ff') : (t.bg || preset.bg);
  root.style.setProperty('--portal-bg', pageBg);
  root.style.setProperty('--portal-card', preset.card);
  root.style.setProperty('--portal-page-overlay', t.dark ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.08)');
}

function loadPortalTheme(key) {
  try {
    const raw = localStorage.getItem(key || 'acmis_portal_theme');
    return raw ? JSON.parse(raw) : { preset: 'ocean', dark: false, accent: THEME_PRESETS.ocean.accent, sidebar: THEME_PRESETS.ocean.sidebar };
  } catch (_) {
    return { preset: 'ocean', dark: false, accent: THEME_PRESETS.ocean.accent, sidebar: THEME_PRESETS.ocean.sidebar };
  }
}

function savePortalTheme(key, theme) {
  try { localStorage.setItem(key || 'acmis_portal_theme', JSON.stringify(theme)); } catch (_) {}
  applyPortalTheme(theme);
}

function ChangePasswordModal({ onClose, onSubmit, embedded = false }) {
  const [cur, setCur] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [err, setErr] = useState('');
  const [ok, setOk] = useState(false);
  const [busy, setBusy] = useState(false);

  async function submit() {
    setErr('');
    if (!pw || pw.length < 4) return setErr('New password must be at least 4 characters.');
    if (pw !== pw2) return setErr('New passwords do not match.');
    setBusy(true);
    const res = await onSubmit(cur, pw);
    setBusy(false);
    if (res && res.ok === false) {
      setErr(res.reason || 'Could not update password.');
      return;
    }
    setOk(true);
    setTimeout(() => onClose(), 900);
  }

  return (
    <div className={embedded ? '' : 'fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4'}>
      <div className={(embedded ? 'w-full' : 'w-full max-w-sm') + ' bg-white/70 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-6'}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2"><Key size={16}/> Change Password</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={18} /></button>
        </div>
        {ok ? (
          <div className="flex items-center gap-2 text-emerald-700 text-sm bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-3">
            <CheckCircle2 size={16} /> Password updated.
          </div>
        ) : (
          <>
            {err && (
              <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
                <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
                <span>{err}</span>
              </div>
            )}
            <PasswordField label="Current password" value={cur} onChange={setCur} />
            <PasswordField label="New password" value={pw} onChange={setPw} />
            <PasswordField label="Confirm new password" value={pw2} onChange={setPw2} onEnter={submit} />

  );
}

/* Student password reset: OTP-code flow (Supabase sends a 6-digit code
   by email instead of a reset link; the student types the code here and
   sets a new password in the same modal — no redirect/link to follow). */
function StudentPasswordResetFlow({ onClose }) {
  const [step, setStep] = useState('email'); // 'email' | 'code' | 'done'
  const [email, setEmail] = useState('');
  const [code, setCode] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function sendCode() {
    setErr('');
    if (!email.trim()) {
      setErr('Enter the email address on your account.');
      return;
    }
    setBusy(true);
    try {
      await callOtpFunction('request', { email: email.trim(), purpose: 'student-reset' });
      setStep('code');
    } catch (e) {
      setErr(e.message);
    }
    setBusy(false);
  }

  async function verifyAndSetPassword() {
    setErr('');
    if (!code.trim()) { setErr('Enter the 6-digit code from your email.'); return; }
    if (!pw || pw.length < 6) { setErr('Password must be at least 6 characters.'); return; }
    if (pw !== pw2) { setErr('Passwords do not match.'); return; }
    setBusy(true);
    try {
      await callOtpFunction('verify', {
        email: email.trim(),
        purpose: 'student-reset',
        code: code.trim(),
        newPassword: pw,
      });
      setBusy(false);
      setStep('done');
    } catch (e) {
      setBusy(false);
      setErr(e.message);
    }
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white/70 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-slate-800 text-sm">Reset your student password</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
            <X size={18} />
          </button>
        </div>

        {step === 'done' ? (
          <div className="flex items-start gap-2 text-emerald-700 text-sm bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-3">
            <CheckCircle2 size={16} className="mt-0.5 flex-shrink-0" />
            <span>Password updated. Close this and log in with your new password.</span>
          </div>
        ) : (
          <>
            {err && (
              <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
                <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
                <span>{err}</span>
              </div>
            )}

            {step === 'email' && (
              <>
                <Field label="Email address">
                  <input
                    autoFocus
                    className={inputCls}
                    placeholder="student@email.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && sendCode()}
                  />
                </Field>
                <button
                  onClick={sendCode}
                  disabled={busy}
                  className="w-full mt-1 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60"
                >
                  {busy ? 'Sending…' : 'Send Verification Code'}
                </button>
              </>
            )}

            {step === 'code' && (
              <>
                <div className="mb-3 text-xs text-slate-500">
                  We sent a 6-digit code to <strong>{email.trim()}</strong>. Enter it below along with your new password.
                </div>
                <Field label="Verification code">
                  <input
                    autoFocus
                    className={inputCls}
                    placeholder="123456"
                    inputMode="numeric"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                  />
                </Field>
                <PasswordField label="New password" value={pw} onChange={setPw} />
                <PasswordField label="Confirm new password" value={pw2} onChange={setPw2} onEnter={verifyAndSetPassword} />
                <button
                  onClick={verifyAndSetPassword}
                  disabled={busy}
                  className="w-full mt-1 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60"
                >
                  {busy ? 'Verifying…' : 'Verify & Set New Password'}
                </button>
                <button
                  onClick={() => { setStep('email'); setErr(''); }}
                  className="w-full mt-2 text-xs text-slate-500 hover:text-slate-700"
                >
                  Use a different email
                </button>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin, goSignup, goRoleGate, goApply, goCheckApplication }) {
  const [reg, setReg] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [showForgot, setShowForgot] = useState(false);

  async function submit() {
    setErr('');

    if (!reg.trim() || !pw) {
      setErr('Enter your email and password.');
      return;
    }

    setBusy(true);

    let client;
    try {
      client = getAuthClient();
    } catch (e) {
      setBusy(false);
      setErr(e.message);
      return;
    }

    const { data, error } = await client.auth.signInWithPassword({
      email: reg.trim(),
      password: pw
    });

    if (error) {
      setBusy(false);
      setErr('Invalid email or password.');
      return;
    }

    const { data: profile, error: profileError } = await client
      .from('students')
      .select('*')
      .eq('id', data.user.id)
      .single();

    setBusy(false);

    if (profileError || !profile) {
      setErr('Signed in, but no student profile was found for this account.');
      return;
    }

    if (profile.status && profile.status !== 'ACTIVE') {
      await client.auth.signOut();
      setErr('This account is ' + profile.status.toLowerCase() + ' and no longer has portal access. Contact the Academic Registrar.');
      return;
    }

    const metadata = data.user?.user_metadata || {};
    const derivedName =
      profile.name ||
      profile.fullname ||
      profile.full_name ||
      [profile.surname, profile.given_name].filter(Boolean).join(' ') ||
      metadata.fullname ||
      [metadata.surname, metadata.given_name].filter(Boolean).join(' ') ||
      'Student';

    const normalizedProfile = {
      ...profile,
      name: String(derivedName).trim() || 'Student',
      reg: profile.reg || profile.registration_number || profile.registration_no || metadata.reg || '',
      year: profile.year ?? profile.academic_year ?? metadata.academic_year ?? 2,
      sem: profile.sem ?? profile.academic_sem ?? metadata.academic_sem ?? 1,
    };

    onLogin(normalizedProfile);
  }

  return (
    <div className="min-h-screen bg-transparent flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white/65 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 p-7">
        <div className="flex flex-col items-center text-center mb-6">
          <Logo size={64} />
          <h1 className="mt-3 font-bold text-slate-900 text-lg leading-tight">
            FORT PORTAL COLLEGE OF
            <br />
            HEALTH SCIENCES
          </h1>
          <p className="text-xs tracking-wide text-slate-400 mt-1 font-medium">ACMIS STUDENT PORTAL</p>
        </div>

        <p className="text-sm font-semibold text-slate-700 mb-3">Log in to your account</p>

        {err && (
          <div className="mb-3 flex items-start gap-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg px-3 py-2">
            <AlertCircle size={14} className="mt-0.5 flex-shrink-0" />
            <span>{err}</span>
          </div>
        )}

        <Field label="Email Address">
          <div className="relative">
            <User size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input
              className={inputCls + ' pl-9'}
              placeholder="student@email.com"
              value={reg}
              onChange={(e) => setReg(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && submit()}
            />
          </div>
        </Field>
        <PasswordField label="Password" value={pw} onChange={setPw} onEnter={submit} />

        <div className="flex justify-end -mt-2 mb-3">
          <button onClick={() => setShowForgot(true)} className="text-xs text-blue-800 font-semibold hover:underline">
            Forgot password?
          </button>
        </div>

        <button
          onClick={submit}
          disabled={busy}
          className="w-full mt-2 bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-2.5 text-sm transition-colors disabled:opacity-60"
        >
          {busy ? 'Signing in…' : 'Sign In'}
        </button>

        <button onClick={goSignup} className="w-full mt-3 text-center text-xs text-blue-800 font-semibold hover:underline">
          New student? Create your account
        </button>
        {goApply && (
          <button onClick={goApply} className="w-full mt-2 text-center text-xs text-emerald-700 font-semibold hover:underline">
            Not yet a student? Apply for admission
          </button>
        )}
        {goCheckApplication && (
          <button onClick={goCheckApplication} className="w-full mt-2 text-center text-[11px] text-slate-400 hover:text-slate-600 hover:underline">
            Check your application status
          </button>
        )}
        {goRoleGate && (
          <button onClick={goRoleGate} className="w-full mt-2 text-center text-[11px] text-slate-400 hover:text-slate-600 hover:underline">
            Not a student? Choose a different login
          </button>
        )}
      </div>

      {showForgot && <StudentPasswordResetFlow onClose={() => setShowForgot(false)} />}
    </div>
  );
}
