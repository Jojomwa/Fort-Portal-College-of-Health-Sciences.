    <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-5" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">

          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={18}/></button>

        <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 mb-3">
          <p><span className="text-slate-400">Email:</span> {app.email}</p>
          <p><span className="text-slate-400">Phone:</span> {app.phone}</p>
          <p><span className="text-slate-400">Age:</span> {app.age}</p>
          <p><span className="text-slate-400">Gender:</span> {app.gender || '—'}</p>
          <p><span className="text-slate-400">Nationality:</span> {app.nationality}</p>
          <p><span className="text-slate-400">Location:</span> {app.location}</p>
          <p><span className="text-slate-400">Program:</span> {app.program}</p>
          <p><span className="text-slate-400">Former school:</span> {app.former_school}</p>

        <div className="space-y-2 mb-4">
          {app.documents.map((d, i) => <ApplicationDocPreview key={i} doc={d} />)}

        {app.status === 'pending' && (
          mode !== 'reject' ? (
            <div className="flex gap-2">
              <button onClick={approve} disabled={busy} className="flex-1 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60">

              </button>
              <button onClick={() => setMode('reject')} className="flex-1 bg-rose-50 text-rose-700 font-semibold rounded-lg py-2.5 text-sm border border-rose-200">
                Reject
              </button>
            </div>
          ) : (
            <div className="space-y-2">
              <textarea className={inputCls} placeholder="Reason (optional)" value={reason} onChange={(e) => setReason(e.target.value)} />
              <div className="flex gap-2">
                <button onClick={reject} disabled={busy} className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg py-2.5 text-sm disabled:opacity-60">
                  {busy ? 'Rejecting…' : 'Confirm Reject'}
                </button>
                <button onClick={() => setMode(null)} className="flex-1 bg-slate-100 text-slate-600 font-semibold rounded-lg py-2.5 text-sm">Cancel</button>
              </div>
            </div>
          )
        )}
        {app.status !== 'pending' && (
          <div className={'text-sm font-semibold rounded-lg px-3 py-2 ' + (app.status === 'rejected' ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700')}>

function AdmissionCriteriaSection({ ar }) {
  const [criteria, setCriteria] = useState(null);
  const [newDistrict, setNewDistrict] = useState('');
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  useEffect(() => { dbGetCriteria().then((c) => setCriteria({ ...c, locations: c.locations || [] })); }, []);

  if (!criteria) return <p className="text-sm text-slate-400 p-4 text-center">Loading…</p>;

  function addDistrict() {
    const d = newDistrict.trim();
    if (!d) return;
    if (!criteria.locations.some((x) => x.toLowerCase() === d.toLowerCase())) {
      setCriteria({ ...criteria, locations: [...criteria.locations, d] });
    }
    setNewDistrict('');
  }
  function removeDistrict(d) {
    setCriteria({ ...criteria, locations: criteria.locations.filter((x) => x !== d) });
  }

  async function saveAndRun() {
    setBusy(true);
    setResult(null);
    const toSave = { ...criteria, updated_at: Date.now(), updated_by: ar.name || ar.email };
    await dbSaveCriteria(toSave);
    setCriteria(toSave);
    const r = await runAutoSelection(toSave);
    setResult(r);
    setBusy(false);
  }

  return (
    <div className="space-y-4 max-w-2xl">
      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h3 className="font-bold text-slate-800 text-sm mb-1 flex items-center gap-2"><Settings size={15}/> Selection Criteria</h3>
        <p className="text-xs text-slate-500">
          Set the rules for this intake, then run auto-selection to tag every application. Leave a field blank to skip that rule. This never changes an application's final status by itself — it only recommends, and you approve or reject as normal.
        </p>
      </div>

      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5 space-y-4">
        <Field label="Minimum points">
          <input type="number" className={inputCls} value={criteria.min_points ?? ''} onChange={(e) => setCriteria({ ...criteria, min_points: e.target.value === '' ? null : e.target.value })} placeholder="e.g. 12" />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Min age">
            <input type="number" className={inputCls} value={criteria.min_age ?? ''} onChange={(e) => setCriteria({ ...criteria, min_age: e.target.value === '' ? null : e.target.value })} placeholder="e.g. 18" />
          </Field>
          <Field label="Max age">
            <input type="number" className={inputCls} value={criteria.max_age ?? ''} onChange={(e) => setCriteria({ ...criteria, max_age: e.target.value === '' ? null : e.target.value })} placeholder="e.g. 25" />
          </Field>
        </div>
        <Field label="Target locations / districts">
          <div className="flex gap-2 mb-2">
            <input className={inputCls} value={newDistrict} onChange={(e) => setNewDistrict(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && (e.preventDefault(), addDistrict())} placeholder="e.g. Jinja" />
            <button onClick={addDistrict} className="px-4 rounded-xl bg-blue-900 text-white text-sm font-semibold flex-shrink-0">Add</button>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {criteria.locations.length === 0 && <span className="text-xs text-slate-400">No location restriction — all districts accepted.</span>}
            {criteria.locations.map((d) => (
              <span key={d} className="inline-flex items-center gap-1 bg-blue-50 text-blue-800 text-xs font-medium px-2.5 py-1 rounded-full">
                {d}
                <button onClick={() => removeDistrict(d)} className="hover:text-blue-950"><X size={12}/></button>
              </span>
            ))}
          </div>
        </Field>

        <button onClick={saveAndRun} disabled={busy}
          className="w-full bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg py-3 text-sm disabled:opacity-60">
          {busy ? 'Running auto-selection…' : 'Save Criteria & Run Auto-Selection'}
        </button>

        {criteria.updated_at && (
          <p className="text-[11px] text-slate-400 text-center">Last run {fmtDate(criteria.updated_at)} by {criteria.updated_by}</p>
        )}

        {result && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800">
            Evaluated {result.total} application(s): <strong>{result.qualified} qualified</strong>, <strong>{result.rejected} rejected</strong>
            {result.skipped > 0 && <>, {result.skipped} skipped (already manually overridden)</>}.
          </div>
        )}
      </div>
    </div>
  );
}

    const prn = { prn: genPRN(), amount: COMMITMENT_FEE, status: 'pending', createdAt: Date.now(), expiry: Date.now() + 14 * 24 * 3600 * 1000 };

function StudentProfileModal({ student, onClose }) {
  const [finance, setFinance] = useState(null);
  const [complaints, setComplaints] = useState(null);
  const [status, setStatus] = useState(student.status || 'ACTIVE');
  const [statusBusy, setStatusBusy] = useState(false);
  const [statusMsg, setStatusMsg] = useState('');
  const [, forceTick] = useState(0);

  useEffect(() => { ensureMarksLoaded(student.reg).then((changed) => changed && forceTick((t) => t + 1)); }, [student.reg]);
  useEffect(() => {
    storeGet('finance:' + student.reg, true).then((f) => setFinance(f || { totalFee: 0, paid: 0, prns: [] }));
    storeGet('complaints:' + student.reg, true).then((c) => setComplaints(c || []));
  }, [student.reg]);

  async function saveStatus(newStatus) {
    setStatusBusy(true);
    setStatusMsg('');
    try {
      const client = getAuthClient();
      const { error } = await client.from('students').update({ status: newStatus }).eq('reg', student.reg);
      if (error) throw error;
      setStatus(newStatus);
      setStatusMsg(newStatus === 'ACTIVE' ? 'Portal access restored.' : 'Portal access revoked — student can no longer log in.');
    } catch (e) {
      setStatusMsg('Could not update status: ' + (e.message || 'unknown error'));
    }
    setStatusBusy(false);
  }

  const recs = resultsByReg[student.reg] || [];
  const latest = recs[recs.length - 1];

function AdminARsSection() {

  const [msg, setMsg] = useState('');

  async function load() {
    const rec = await ensureRegistrarSeed();
    setAR(rec);
  }
  useEffect(() => { load(); }, []);

  async function unlockDevice() {
    setBusy(true);
    const fresh = await storeGet('ar:' + REGISTRAR_ID, true);
    fresh.deviceId = null;

    setBusy(false);
    setMsg('Device unlocked — the Registrar can sign in from a new phone next time.');
    load();
  }

  async function forcePasswordReset() {
    setBusy(true);

  return (

          <div>

            <p className="text-xs text-slate-400 font-mono">{ar.email}</p>

function AdminElectionsSection() {
  const [election, setElection] = useState(null);
  const [votes, setVotes] = useState({});
  const [newPostTitle, setNewPostTitle] = useState('');
  const [candidateInputs, setCandidateInputs] = useState({});
  const [busy, setBusy] = useState(false);

  async function reload() {
    const cfg = await loadElectionConfig();
    setElection(cfg);
    const v = (await storeGet('election_votes', true)) || {};
    setVotes(v);
  }
  useEffect(() => {
    reload();
  }, []);

  async function addPost() {
    if (!newPostTitle.trim()) return;
    setBusy(true);
    const id = slugifyPost(newPostTitle);
    const next = { ...election, positions: [...election.positions, { id, title: newPostTitle.trim(), candidates: [] }] };
    await saveElectionConfig(next);
    setElection(next);
    setNewPostTitle('');
    setBusy(false);
  }

  async function removePost(posId) {
    const next = { ...election, positions: election.positions.filter((p) => p.id !== posId) };
    await saveElectionConfig(next);
    setElection(next);
  }

  async function addCandidate(posId) {
    const name = (candidateInputs[posId] || '').trim();
    if (!name) return;
    const next = {
      ...election,
      positions: election.positions.map((p) => (p.id === posId ? { ...p, candidates: [...p.candidates, name] } : p)),
    };
    await saveElectionConfig(next);
    setElection(next);
    setCandidateInputs({ ...candidateInputs, [posId]: '' });
  }

  async function removeCandidate(posId, name) {
    const next = {
      ...election,
      positions: election.positions.map((p) => (p.id === posId ? { ...p, candidates: p.candidates.filter((c) => c !== name) } : p)),
    };
    await saveElectionConfig(next);
    setElection(next);
  }

  if (!election) return <p className="text-sm text-slate-400">Loading…</p>;

  return (
    <div className="space-y-6">
      <div className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
        <h3 className="font-bold text-slate-800 text-sm mb-3">Add a New Post (Position)</h3>
        <div className="flex gap-2">
          <input className={inputCls} placeholder="e.g. Guild Treasurer" value={newPostTitle} onChange={(e) => setNewPostTitle(e.target.value)} />
          <button onClick={addPost} disabled={busy} className="bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg px-4 py-2 text-xs disabled:opacity-60 whitespace-nowrap">
            + Add Post
          </button>
        </div>
      </div>

      {election.positions.map((pos) => {
        const posVotes = votes[pos.id] || {};
        const total = Object.values(posVotes).reduce((a, b) => a + b, 0);
        return (
          <div key={pos.id} className="bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 p-5">
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-semibold text-slate-800 text-sm">{pos.title}</h4>
              <button onClick={() => removePost(pos.id)} className="text-xs text-rose-500 hover:text-rose-700">Remove post</button>
            </div>
            <div className="space-y-2 mb-4">
              {pos.candidates.map((c) => {
                const count = posVotes[c] || 0;
                const pct = total ? Math.round((count / total) * 100) : 0;
                return (
                  <div key={c}>
                    <div className="flex items-center justify-between text-sm mb-1">
                      <span className="text-slate-700">{c}</span>
                      <span className="flex items-center gap-2">
                        <span className="text-xs text-slate-400">{count} vote{count !== 1 ? 's' : ''} · {pct}%</span>
                        <button onClick={() => removeCandidate(pos.id, c)} className="text-[11px] text-rose-500 hover:text-rose-700">remove</button>
                      </span>
                    </div>
                    <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className="h-full bg-blue-800" style={{ width: pct + '%' }} />
                    </div>
                  </div>
                );
              })}
              {pos.candidates.length === 0 && <p className="text-xs text-slate-400">No candidates inserted yet for this post.</p>}
            </div>
            <div className="flex gap-2">
              <input
                className={inputCls}
                placeholder="Candidate full name"
                value={candidateInputs[pos.id] || ''}
                onChange={(e) => setCandidateInputs({ ...candidateInputs, [pos.id]: e.target.value })}
              />
              <button onClick={() => addCandidate(pos.id)} className="bg-gradient-to-b from-blue-800 to-blue-950 hover:from-blue-700 hover:to-blue-900 shadow-md shadow-blue-950/25 active:scale-[0.97] transition-all text-white font-semibold rounded-lg px-4 py-2 text-xs whitespace-nowrap">
                + Insert Candidate
              </button>
            </div>
            <p className="text-[11px] text-slate-400 mt-2">Total votes cast for this post: {total}</p>
          </div>
        );
      })}
      {election.positions.length === 0 && <p className="text-sm text-slate-400">No posts yet — add one above.</p>}
    </div>
  );
}

                {(ar.courseUnits || []).map((u, i) => (
                  <div key={i} className="p-4 text-sm text-slate-700">{u}</div>
                ))}
                {(!ar.courseUnits || ar.courseUnits.length === 0) && (
                  <p className="text-sm text-slate-400 p-4 text-center">No course units assigned yet — contact the administrator.</p>
                )}
              </div>
            )}
            {section === 'applications' && <ARApplicationsSection ar={ar} />}
            {section === 'criteria' && <AdmissionCriteriaSection ar={ar} />}
            {section === 'rejected' && <ARRejectedReviewSection ar={ar} />}
            {section === 'stats' && <ARStatisticsSection students={students} />}
            {section === 'calendar' && <ARCalendarSection />}
            {section === 'announcements' && (
              <div className="cine-card bg-white/60 backdrop-blur-xl rounded-2xl border border-white/60 shadow-lg shadow-slate-900/5 divide-y divide-white/50">
                {announcements.map((a) => (
                  <div key={a.id} className="p-4">
                    <p className="text-sm font-semibold text-slate-800">{a.subject}</p>
                    <p className="text-xs text-slate-500 mt-1">{a.body}</p>
                    <p className="text-[11px] text-slate-300 mt-1">From {a.from} · {fmtDate(a.date)}</p>
                  </div>
                ))}
                {announcements.length === 0 && <p className="text-sm text-slate-400 p-4 text-center">No announcements yet.</p>}
              </div>
            )}
            {section === 'marks' && <ARMarksSection students={students} />}
            {section === 'message' && <ARMessagePrincipalSection ar={ar} />}
          </div>
        </main>
      </div>

      {showSettings && (
        <PortalSettingsModal
          onClose={() => setShowSettings(false)}
          themeKey={'ar_' + ar.id}
          onPasswordSubmit={async (cur, newPw) => {
            const fresh = await storeGet('ar:' + ar.id, true);
            if (!fresh || fresh.pw !== obfuscate(cur)) return { ok: false, reason: 'Current password is incorrect.' };
            fresh.pw = obfuscate(newPw);
            await storeSet('ar:' + ar.id, fresh, true);
            setAR(fresh);
            return { ok: true };
          }}
        />
      )}
      <AssistantWidget role="ar" />
    </div>
  );
}

/* ============================ AI ASSISTANT ============================
   A guided-help chat widget shown on the Student, Admin, and AR dashboards.
   There's no real OpenAI/Anthropic key wired in here — this is a static,
   client-only file, and shipping a real LLM API key in client-side code
   would expose it to anyone who opens dev tools. Instead:
   - callAssistant() first tries window.ASSISTANT_API_URL, a URL you can set
     to your own backend that safely holds an API key server-side and
     proxies to whichever model you like.
   - If that isn't configured, it falls back to a scripted, keyword-matched
     responder (offlineAssistantReply) that still answers the common
     "how do I…" questions for each role out of the box, no backend needed. */
const ASSISTANT_KB = {
  student: [
    { q: ['apply', 'admission', 'new student'], a: 'To apply for admission, go to the login screen and tap "Not yet a student? Apply for admission". You\'ll enter your bio-data, pick a program, and upload your result documents.' },
    { q: ['status', 'check application', 'my application'], a: 'Use "Check your application status" on the login screen with your Application Reference (e.g. APP-123456) and the email you applied with.' },
    { q: ['prn', 'pay', 'fee', 'payment'], a: 'Go to Payments, tap Generate PRN, enter the amount, then take that PRN to your bank or mobile money agent. Come back and enter it under Confirm Payment once you\'ve paid.' },
    { q: ['password', 'forgot', 'reset'], a: 'On the login screen, tap "Forgot password?" and follow the prompts.' },
    { q: ['result', 'marks', 'grade'], a: 'Your results appear once your Registrar has uploaded and distributed them for your course units.' },
    { q: ['enroll', 'register', 'registration'], a: 'Go to the Enrollment section to register for the current semester.' },
  ],
  admin: [
    { q: ['ar', 'registrar', 'device', 'unlock'], a: 'Under Registrar, you can see the single Registrar account\'s status and tap "Unlock device" if they\'ve switched phones, or "Force password reset" if they\'ve lost access.' },
    { q: ['student', 'manage student'], a: 'Use the Students section to search and manage student accounts.' },
    { q: ['performance', 'statistics'], a: 'The Performance section shows pass rates and averages, overall and by year.' },
    { q: ['announcement'], a: 'Use Announcements to broadcast a message to students, the Registrar, or everyone.' },
    { q: ['election'], a: 'Use Elections to configure guild election posts and candidates.' },
  ],
  ar: [
    { q: ['upload', 'marks', 'pdf', 'distribute'], a: 'Go to Marks & Results, pick Program → Year → Semester → course unit, then drag in the PDF holding the class list and marks. Rows get matched to students automatically — just review any it couldn\'t confidently match before saving.' },
    { q: ['application', 'applicant', 'admission'], a: 'Go to Applications to review new applicants\' documents. Approving one automatically generates a commitment-fee PRN for them — no need to create it by hand.' },
    { q: ['device', 'phone', 'locked'], a: 'If your account gets locked to a new phone, ask the Administrator to "Unlock device" for you in their Registrar panel.' },
    { q: ['statistics', 'population'], a: 'The Statistics section shows overall student population and performance by year.' },
    { q: ['calendar', 'semester dates', 'highlight'], a: 'Go to Calendar, tap a start day then an end day to mark a period (e.g. the semester or exam window), give it a label and a color. It shows up automatically for every student and the Administrator — only you can add or remove these.' },
  ],
};
function offlineAssistantReply(role, message) {
  const q = message.toLowerCase();
  const kb = ASSISTANT_KB[role] || [];
  const hit = kb.find((entry) => entry.q.some((k) => q.includes(k)));
  if (hit) return hit.a;
  const contact = role === 'student' ? 'the Registrar' : role === 'ar' ? 'the Administrator' : 'IT support';
  return "I'm not sure about that one yet — try asking about applications, marks, payments, or your account, or reach out to " + contact + ' directly.';
}
async function callAssistant(role, message) {
  if (window.ASSISTANT_API_URL) {
    try {
      const res = await fetch(window.ASSISTANT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, message }),
      });
      const data = await res.json();
      if (data && data.reply) return data.reply;
    } catch (e) {
      // fall through to the offline responder below
    }
  }
  return offlineAssistantReply(role, message);
}
const ASSISTANT_GREETING = {
  student: 'Hi! I can help you apply for admission, check your application, pay fees, or find your way around the portal. What do you need?',
  admin: 'Hi! Ask me about managing the Registrar account, students, performance, or announcements.',
  ar: 'Hi! Ask me about uploading marks, reviewing applications, or anything else in your dashboard.',
};
function AssistantWidget({ role }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState(() => [{ from: 'bot', text: ASSISTANT_GREETING[role] || 'Hi! How can I help?' }]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  async function send() {
    const text = input.trim();
    if (!text) return;
    setInput('');
    setMessages((prev) => [...prev, { from: 'user', text }]);
    setBusy(true);
    const reply = await callAssistant(role, text);
    setMessages((prev) => [...prev, { from: 'bot', text: reply }]);
    setBusy(false);
  }

  return (
    <>
      <button onClick={() => setOpen((o) => !o)}
        className="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-gradient-to-b from-blue-800 to-blue-950 text-white shadow-xl shadow-blue-950/30 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
        {open ? <X size={22}/> : <MessageCircle size={22}/>}
      </button>
      {open && (
        <div className="fixed bottom-24 right-5 z-40 w-[calc(100vw-2.5rem)] max-w-sm h-[28rem] bg-white/90 backdrop-blur-2xl border border-white/60 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
          <div className="px-4 py-3 bg-blue-950 text-white flex items-center gap-2 flex-shrink-0">
            <MessageCircle size={16}/>
            <p className="text-sm font-semibold">Assistant</p>
            {!window.ASSISTANT_API_URL && <span className="ml-auto text-[10px] px-2 py-0.5 rounded-full bg-white/15">offline mode</span>}
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto p-3 space-y-2">
            {messages.map((m, i) => (
              <div key={i} className={'max-w-[85%] px-3 py-2 rounded-2xl text-xs leading-relaxed ' + (m.from === 'bot' ? 'bg-slate-100 text-slate-700 rounded-bl-sm' : 'bg-blue-900 text-white ml-auto rounded-br-sm')}>
                {m.text}
              </div>
            ))}
            {busy && <div className="max-w-[70%] px-3 py-2 rounded-2xl text-xs bg-slate-100 text-slate-400 rounded-bl-sm">Typing…</div>}
          </div>
          <div className="p-2.5 border-t border-slate-200 flex gap-2 flex-shrink-0">
            <input className={inputCls + ' text-xs py-2'} placeholder="Ask a question…" value={input}
              onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} />
            <button onClick={send} disabled={busy} className="bg-blue-950 hover:bg-blue-900 text-white rounded-lg px-3 disabled:opacity-50">
              <Send size={15}/>
            </button>
          </div>
        </div>
      )}
    </>
  );
}

/* ============================== APP =================================== */
function App() {
  const [page, setPage] = useState('splash');
  const [account, setAccount] = useState(null);
  const [admin, setAdmin] = useState(null);
  const [ar, setAR] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);

  // STEP 5 — keep students logged in across refreshes, and STEP 7 — catch
  // the "password recovery" session Supabase opens when a student clicks
  // their reset-password email link.
  useEffect(() => {
    let client;
    try {
      client = getAuthClient();
    } catch (e) {
      setAuthChecked(true);
      return;
    }

    async function loadFromSession(session) {
      if (!session) {
        setAuthChecked(true);
        return;
      }
      const { data: profile } = await client.from('students').select('*').eq('id', session.user.id).maybeSingle();
      if (profile) {
        const metadata = session.user?.user_metadata || {};
        const derivedName =
          profile.name ||
          profile.fullname ||
          profile.full_name ||
          [profile.surname, profile.given_name].filter(Boolean).join(' ') ||
          metadata.fullname ||
          [metadata.surname, metadata.given_name].filter(Boolean).join(' ') ||
          'Student';

        setAccount({
          ...profile,
          name: String(derivedName).trim() || 'Student',
          reg: profile.reg || profile.registration_number || profile.registration_no || metadata.reg || '',
          year: profile.year ?? profile.academic_year ?? metadata.academic_year ?? 2,
          sem: profile.sem ?? profile.academic_sem ?? metadata.academic_sem ?? 1,
        });
        setPage('app');
      } else {
        console.error('Authenticated student has no students row:', session.user.id);
      }
      setAuthChecked(true);
    }

    client.auth.getSession().then(({ data }) => loadFromSession(data.session));

    const { data: sub } = client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        setPage('reset-password');
      } else if (event === 'SIGNED_OUT') {
        setAccount(null);
      }
    });

    return () => sub && sub.subscription && sub.subscription.unsubscribe();
  }, []);

  // STEP 8 — protect student routes: bounce back to login if the app page
  // is reached without a signed-in account (e.g. stale state after sign-out).
  useEffect(() => {
    if (authChecked && page === 'app' && !account) {
      setPage('login');
    }
  }, [authChecked, page, account]);

  if (!authChecked) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-transparent text-slate-200/80 text-sm">
        Loading…
      </div>
    );
  }

  if (page === 'reset-password') {
    return <StudentSetNewPasswordScreen onDone={() => setPage('login')} />;
  }

  if (page === 'splash') {
    return <SplashScreen onDone={() => setPage('gate')} />;
  }

  if (page === 'gate') {
    return (
      <RoleGate
        onPick={(role) => {
          if (role === 'student') setPage('login');
          if (role === 'ar') setPage('ar-login');
          if (role === 'admin') setPage('admin-login');
        }}
      />
    );
  }

  if (page === 'login') {
    return (
      <LoginScreen
        onLogin={(acc) => { setAccount(acc); setPage('app'); }}
        goSignup={() => setPage('signup')}
        goRoleGate={() => setPage('gate')}
        goApply={() => setPage('apply')}
        goCheckApplication={() => setPage('check-application')}
      />
    );
  }
  if (page === 'apply') {
    return <ApplyScreen goLogin={() => setPage('login')} />;
  }
  if (page === 'check-application') {
    return <CheckApplicationScreen goLogin={() => setPage('login')} />;
  }
  if (page === 'signup') {
    return (
      <SignupScreen
        onCreated={(acc) => { setAccount(acc); setPage('app'); }}
        goLogin={() => setPage('login')}
      />
    );
  }
  if (page === 'app') {
    return (
      <StudentAppErrorBoundary>
        <Dashboard
          account={account}
          setAccount={setAccount}
          onLogout={async () => {
            try { await getAuthClient().auth.signOut(); } catch (e) { /* already signed out / offline */ }
            setAccount(null);
            setPage('gate');
          }}
        />
      </StudentAppErrorBoundary>
    );
  }

  if (page === 'admin-login') {
    return (
      <AdminLoginScreen
        onLogin={(acc) => { setAdmin(acc); setPage('admin-app'); }}
        goRoleGate={() => setPage('gate')}
      />
    );
  }
  if (page === 'admin-app') {
    return <AdminDashboard admin={admin} onLogout={() => { setAdmin(null); setPage('gate'); }} />;
  }

  if (page === 'ar-login') {
    return (
      <ARLoginScreen
        onLogin={(rec) => { setAR(rec); setPage('ar-app'); }}
        goRoleGate={() => setPage('gate')}
      />
    );
  }
  if (page === 'ar-app') {
    return <ARDashboard ar={ar} setAR={setAR} onLogout={() => { setAR(null); setPage('gate'); }} />;
  }

  return null;
}


// (marks overlay is now loaded per-student via ensureMarksLoaded, called
// from the screens that display results — see ProgrammeSection etc.)
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ===================== One-tap "Install App" banner =====================
     Shows automatically as soon as the page loads (no menu-hunting needed).
     - Android / Chrome / Edge: a real one-tap Install button (uses the
       browser's native beforeinstallprompt API).
     - iOS Safari: Apple does not allow any website to trigger the install
       prompt programmatically, so instead we show clear on-screen
       instructions pointing at the Share button.
     - Hidden automatically if the app is already installed / running
       standalone. -->
<style>
  #installBanner {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 16px;
    z-index: 9999;
    background: #0b1541;
    color: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 14px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    animation: installBannerIn 0.35s ease-out;
  }
  @keyframes installBannerIn {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #installBanner .ib-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    flex-shrink: 0;
    object-fit: contain;
    background: #fff;
  }
  #installBanner .ib-text {
    flex: 1;
    min-width: 0;
  }
  #installBanner .ib-title {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.2;
  }
  #installBanner .ib-sub {
    font-size: 12px;
    color: #c7cbe0;
    margin-top: 2px;
    line-height: 1.3;
  }
  #installBanner button.ib-install {
    background: #fff;
    color: #0b1541;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  #installBanner button.ib-close {
    background: transparent;
    color: #9aa0c0;
    border: none;
    font-size: 20px;
    line-height: 1;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  #installBanner .ib-share-arrow {
    display: inline-block;
    animation: ib-bounce 1.2s infinite;
  }
  @keyframes ib-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
</style>
<div id="installBanner">
  <img class="ib-icon" alt="" id="ibIcon" />
  <div class="ib-text">
    <div class="ib-title">Install ACMIS Portal</div>
    <div class="ib-sub" id="ibSub">Get one-tap access from your home screen.</div>
  </div>
  <button class="ib-install" id="ibInstallBtn" style="display:none;">Install</button>
  <button class="ib-close" id="ibCloseBtn" aria-label="Dismiss">&times;</button>
</div>
<script>
(function () {
  var banner = document.getElementById('installBanner');
  var installBtn = document.getElementById('ibInstallBtn');
  var closeBtn = document.getElementById('ibCloseBtn');
  var sub = document.getElementById('ibSub');
  var icon = document.getElementById('ibIcon');
  var deferredPrompt = null;

  // Reuse the same crest already embedded for the favicon/manifest.
  try {
    var existingIcon = document.querySelector('link[rel="apple-touch-icon"]');
    icon.src = existingIcon ? existingIcon.href : '';
  } catch (e) {}

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function dismissForNow() {
    banner.style.display = 'none';
  }

  closeBtn.addEventListener('click', dismissForNow);

  if (isStandalone()) {
    // Already installed / launched from home screen — nothing to do.
    return;
  }

  var ua = window.navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
  var isSafari = isIOS && /safari/i.test(ua) && !/crios|fxios|opios/i.test(ua);

  if (isIOS) {
    // No programmatic install API on iOS — show Share-sheet instructions.
    sub.innerHTML = 'Tap <b>Share</b> <span class="ib-share-arrow">⬆️</span> below, then "Add to Home Screen".';
    banner.style.display = 'flex';
    return;
  }

  // Android / Chrome / Edge / other Chromium browsers.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
    banner.style.display = 'flex';
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null;
      dismissForNow();
    });
  });

  window.addEventListener('appinstalled', dismissForNow);
})();
</script>
</body>
</html>
